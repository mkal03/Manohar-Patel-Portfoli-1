<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Vedanta Security Exam Portal — VSES (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<style>
:root{
  --bg:#0A0F1C;
  --bg-2:#0D1424;
  --panel:#121A2E;
  --panel-2:#182238;
  --line:#232F49;
  --line-2:#2C3A5A;
  --text:#EAEFF9;
  --muted:#8C99B8;
  --muted-2:#5F6C8C;
  --amber:#F0A93B;
  --amber-soft:rgba(240,169,59,.14);
  --green:#3FBF7F;
  --green-soft:rgba(63,191,127,.14);
  --red:#E5636B;
  --red-soft:rgba(229,99,107,.14);
  --blue:#5B8DEF;
  --glass:rgba(18,26,46,.7);
  --radius:12px;
  --radius-sm:8px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --font-dev:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
/* Light theme — toggled site-wide from Admin → Site Settings (sets
   data-theme="light" on <html>; default with no attribute is dark). */
html[data-theme="light"]{
  --bg:#F3F5FA;
  --bg-2:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F0F3F9;
  --line:#E1E6F0;
  --line-2:#CBD3E3;
  --text:#131A2C;
  --muted:#5B6B8C;
  --muted-2:#8593AD;
  --amber:#DB901F;
  --amber-soft:rgba(219,144,31,.14);
  --green:#1F9D5D;
  --green-soft:rgba(31,157,93,.12);
  --red:#D64550;
  --red-soft:rgba(214,69,80,.12);
  --blue:#3B6FE0;
  --glass:rgba(255,255,255,.75);
}
/* Black theme — near-black panels, same accent colors as dark. */
html[data-theme="black"]{
  --bg:#000000;
  --bg-2:#060606;
  --panel:#0E0E0E;
  --panel-2:#181818;
  --line:#262626;
  --line-2:#333333;
  --text:#F2F2F2;
  --muted:#9A9A9A;
  --muted-2:#6E6E6E;
  --amber:#F0A93B;
  --amber-soft:rgba(240,169,59,.14);
  --green:#3FBF7F;
  --green-soft:rgba(63,191,127,.14);
  --red:#E5636B;
  --red-soft:rgba(229,99,107,.14);
  --blue:#5B8DEF;
  --glass:rgba(8,8,8,.78);
}
/* Blue theme — deep navy/black panels with a cobalt-blue accent in
   place of amber, in the spirit of the Control Room CCTV dashboard look. */
html[data-theme="blue"]{
  --bg:#060B18;
  --bg-2:#081024;
  --panel:#0D1B33;
  --panel-2:#122445;
  --line:#1B3156;
  --line-2:#234070;
  --text:#EAF2FF;
  --muted:#8FA6CC;
  --muted-2:#60799E;
  --amber:#2E7BF6;
  --amber-soft:rgba(46,123,246,.16);
  --green:#2FD6C0;
  --green-soft:rgba(47,214,192,.14);
  --red:#F2566A;
  --red-soft:rgba(242,86,106,.14);
  --blue:#2E7BF6;
  --glass:rgba(13,27,51,.78);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[lang-hi]{font-family:var(--font-dev);}
#app{min-height:100vh;display:flex;flex-direction:column;}
::selection{background:var(--amber-soft);}
a{color:inherit;}
button{font-family:inherit;}
.wrap{max-width:none;margin:0 auto;padding:0 clamp(16px,3vw,56px);width:100%;}
.wrap-narrow{max-width:640px;margin:0 auto;padding:0 20px;width:100%;}

/* ---- topbar ---- */
.topbar{
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,3vw,56px);max-width:none;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;font-size:16px;user-select:none;-webkit-user-select:none;-moz-user-select:none;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);flex-shrink:0;}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px;}
.session-chip{display:flex;align-items:center;gap:10px;}
.session-chip .who{text-align:right;line-height:1.25;}
.session-chip .who b{font-size:13px;display:block;}
.session-chip .who span{font-size:11px;color:var(--muted);font-family:var(--font-mono);}
.btn{
  border:1px solid var(--line-2);
  background:var(--panel-2);
  color:var(--text);
  padding:9px 16px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s border-color, .15s background, .15s transform;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--amber);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#211404;}
.btn-primary:hover{background:#f5b658;border-color:#f5b658;}
.btn-primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:var(--line-2);}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn-danger:hover{background:var(--red-soft);}
.icon-del-btn{
  width:30px;height:30px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;border:none;cursor:pointer;
  transition:.15s background,.15s transform;
}
.icon-del-btn:hover{background:#c94951;}
.icon-del-btn:active{transform:scale(.92);}
.icon-del-btn .ic{width:14px;height:14px;}
.name-link{color:var(--amber);cursor:pointer;text-decoration:none;font-weight:600;}
.name-link:hover{text-decoration:underline;}
.btn-icon{padding:7px 9px;display:inline-flex;align-items:center;justify-content:center;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}

main{flex:1;padding:32px 0 60px;}

/* ---- hero / role select ---- */
.hero{padding:56px 0 20px;text-align:center;}
.hero h1{font-size:34px;margin:0 0 10px;font-weight:800;letter-spacing:-.5px;}
.hero p{color:var(--muted);font-size:15px;margin:0 auto;max-width:480px;line-height:1.55;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;}
@media (max-width:560px){.role-grid{grid-template-columns:1fr;}}
.role-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;text-align:left;cursor:pointer;transition:.15s border-color,.15s transform;
}
.role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
.role-card .icon{width:40px;height:40px;border-radius:10px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px;}
.role-card h3{margin:0 0 6px;font-size:17px;}
.role-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;}

/* ---- card / panel ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.panel-head h2{margin:0;font-size:19px;}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px;}
.tab{flex:1;text-align:center;padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);}
.tab.active{background:var(--amber);color:#211404;}

/* ---- form ---- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:11px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.error-box{background:var(--red-soft);border:1px solid var(--red);color:#ffb3b7;padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;}
.demo-box{background:rgba(56,189,248,.10);border:1px solid #38bdf8;color:var(--text);padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6;margin-bottom:16px;}
.demo-box b.dt{display:inline-block;background:#38bdf8;color:#04121c;border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:.04em;margin-bottom:4px;}
.demo-box ol{margin:6px 0 0 18px;padding:0;}
.demo-box li{margin:2px 0;}
.demo-home{max-width:620px;margin:14px 0 4px;}
.info-box{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;}

/* ---- month/exam grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;transition:.15s border-color,.15s transform;text-align:left;
}
.tile:hover{border-color:var(--amber);transform:translateY(-2px);}
.tile .tile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.tile .month-icon{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:16px;}
.tile h3{margin:0 0 4px;font-size:16px;}
.tile .sub{color:var(--muted);font-size:12.5px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px;}
.badge-pending{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2);}
.badge-done{background:var(--green-soft);color:var(--green);}
.badge-locked{background:var(--red-soft);color:var(--red);}
.badge-open{background:var(--amber-soft);color:var(--amber);}

.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:18px;flex-wrap:wrap;}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:none;}
.crumb a:hover{color:var(--amber);}

/* ---- exam runner ---- */
.exam-read{ max-width:860px; margin:0 auto; }
.exam-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.progress-track{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:14px 0 26px;}
.progress-fill{height:100%;background:var(--amber);transition:width .2s;}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;margin-bottom:14px;}
.qcard.answered{border-color:var(--line-2);}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--panel-2);font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--muted);margin-right:10px;flex-shrink:0;}
.qtext{font-size:15.5px;font-weight:600;line-height:1.5;display:flex;gap:2px;align-items:flex-start;}
.qimg{max-width:100%;border-radius:8px;margin:12px 0 4px;display:block;border:1px solid var(--line);}
.opt-list{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.opt-list.opt-images{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.opt-list.opt-images{grid-template-columns:1fr;}}
.opt{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;font-size:14px;transition:.12s border-color,.12s background;
}
.opt:hover{border-color:var(--amber);}
.opt.selected{border-color:var(--amber);background:var(--amber-soft);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;font-family:var(--font-mono);}
.opt.selected .letter{border-color:var(--amber);background:var(--amber);color:#211404;}
.opt.correct .letter{border-color:var(--green);background:var(--green);color:#062814;}
.opt.wrong .letter{border-color:var(--red);background:var(--red);color:#2b0709;}
.opt img{width:100%;border-radius:6px;display:block;margin-top:4px;}
.opt-images .opt{flex-direction:column;align-items:stretch;}
.opt-images .opt .letter{align-self:flex-start;margin-bottom:2px;}
.lang-toggle{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px;}
.lang-toggle button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;cursor:pointer;}
.lang-toggle button.active{background:var(--amber);color:#211404;}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch-track{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:.2s background;flex-shrink:0;}
.switch-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s transform;}
.switch input:checked + .switch-track{background:var(--green);}
.switch input:checked + .switch-track::after{transform:translateX(18px);}
.switch-label{font-size:13.5px;font-weight:600;color:var(--text);}
.field label.switch{display:inline-flex;margin-bottom:0;}

/* ---- result ---- */
.result-hero{text-align:center;padding:40px 20px;}
.score-ring{width:140px;height:140px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:6px solid var(--line);position:relative;}
.score-ring .num{font-size:34px;font-weight:800;font-family:var(--font-mono);}
.score-ring .den{font-size:12px;color:var(--muted);}

/* ---- table ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
thead th{text-align:left;padding:11px 14px;background:var(--panel-2);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel-2);}
.mono{font-family:var(--font-mono);}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .icon{font-size:34px;margin-bottom:10px;}

/* ---- admin layout ---- */
.admin-layout{display:block;}

/* Logo itself is the sidebar trigger for admins (no separate button). */
.brand-clickable{cursor:pointer;border-radius:var(--radius-sm);padding:4px 8px;margin:-4px -8px;transition:.15s background;}
.brand-clickable:hover,.brand-clickable:focus-visible{background:var(--panel-2);outline:none;}

/* Sidebar sits strictly between the header and footer bars — its top is
   pinned to the measured header height (--hdr-h, set from JS) and it
   never overlaps either bar: both the header (z-index 20) and the
   footer (z-index 16) are stacked above it (z-index 15). It slides in
   left→right on open and reverses right→left on close, with a slow,
   clearly-visible motion. There is no dimming backdrop and nothing is
   ever disabled underneath — instead, the open section itself shrinks
   to fit the remaining width (see main.admin-sidebar-open below) and
   stays fully usable while the sidebar is open. */
.admin-sidebar{
  position:fixed;left:0;top:var(--hdr-h,64px);height:calc(100vh - var(--hdr-h,64px));
  width:var(--sidebar-w,272px);max-width:84vw;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:15;
  transform:translateX(-100%);transition:transform .55s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 0 70px rgba(0,0,0,.45);
}
.admin-sidebar.open{transform:translateX(0);}
.admin-nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;}
/* Scrollbars everywhere pick up the current theme's colors instead of
   staying the browser's plain white default. */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;}
*::-webkit-scrollbar-thumb:hover{background:var(--muted-2);}
/* ...except the sidebar's own scroll track on the Dashboard tab, which
   stays hidden there (other tabs keep the themed scrollbar above). */
.admin-sidebar[data-tab="dashboard"] .admin-nav{scrollbar-width:none;-ms-overflow-style:none;}
.admin-sidebar[data-tab="dashboard"] .admin-nav::-webkit-scrollbar{display:none;}
.admin-nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);
  padding:11px 12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.2s background,.2s color;
}
.admin-nav button .ic{
  width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--panel-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:.2s background,.2s color;
}
.admin-nav button .ic svg{width:16px;height:16px;}
.admin-nav button:hover{background:var(--panel-2);color:var(--text);}
.admin-nav button:hover .ic{background:var(--line-2);color:var(--text);}
.admin-nav button.active{background:var(--amber-soft);color:var(--amber);}
.admin-nav button.active .ic{background:var(--amber);color:#211404;}

/* The open section shrinks to fit beside the sidebar (same slow motion,
   so both move together) instead of being covered or disabled; it
   returns to full width the moment the sidebar closes. */
main{transition:margin-left .55s cubic-bezier(.22,.61,.36,1);}
body.admin-sidebar-open main{margin-left:var(--sidebar-w,272px);}


.item-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--panel-2);
}
.item-row .info b{display:block;font-size:14.5px;margin-bottom:2px;}
.item-row .info span{color:var(--muted);font-size:12px;}
.item-row .actions{display:flex;gap:8px;flex-shrink:0;}

.q-edit-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;background:var(--panel-2);}
.q-edit-row .qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.q-edit-row .qtop b{font-size:14px;}
.q-edit-row .opts-preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--line-2);color:var(--muted);}
.chip.right{border-color:var(--green);color:var(--green);}

.opt-builder{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--bg-2);}
.opt-builder-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.opt-builder-top label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;}
.img-drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;}
.img-drop img{max-width:100%;max-height:90px;border-radius:6px;margin-top:8px;}

.search-box{display:flex;gap:10px;margin-bottom:20px;}
.search-box input{
  flex:1;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:11px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;
}
.search-box input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}

.divider{height:1px;background:var(--line);margin:22px 0;}

/* ---- compact admin controls: inputs / dropdowns / search boxes used to
   stretch across the whole wide card. Cap them so the admin panel looks tidy. ---- */
.admin-layout .field select{max-width:300px;}
.admin-layout .field input[type=text],
.admin-layout .field input[type=tel],
.admin-layout .field input[type=email],
.admin-layout .field input[type=password],

.admin-layout .field-row{grid-template-columns:repeat(auto-fit,minmax(180px,280px));}
.admin-layout .opt-builder .field input[type=text]{max-width:none;}
.admin-layout .opt-builder .field-row{grid-template-columns:1fr 1fr;}
@media (max-width:520px){.admin-layout .opt-builder .field-row{grid-template-columns:1fr;}}
.admin-layout .search-box{max-width:380px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
@media (max-width:600px){.stat-row{grid-template-columns:1fr 1fr;}}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
.stat-box{position:relative;}
.stat-box .pct{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-weight:800;font-size:15px;color:var(--pc,var(--amber));}
.stat-box .n{font-size:22px;font-weight:800;font-family:var(--font-mono);}
.stat-box .l{font-size:11.5px;color:var(--muted);margin-top:3px;}
.stat-box.clickable{cursor:pointer;transition:.15s border-color,.15s transform;}
.stat-box.clickable:hover{border-color:var(--amber);}
.stat-box.clickable:active{transform:scale(.98);}
.d-kpi[data-dashbox]{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.stat-row-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:900px){.stat-row-5{grid-template-columns:repeat(3,1fr);}}
.stat-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:0;}
@media (max-width:600px){.stat-row-3{grid-template-columns:1fr;}}
select.select-inline{width:auto;display:inline-block;}
.toggle-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--muted);}

/* ---- minimalist icons ---- */
.ic{display:inline-flex;align-items:center;justify-content:center;width:var(--ic-size,18px);height:var(--ic-size,18px);flex-shrink:0;}
.ic svg{width:100%;height:100%;}
.brand-icon{width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon .ic{width:15px;height:15px;}
.role-card .icon{color:var(--amber);}
.admin-nav button .ic{color:inherit;}
.tile .month-icon{color:var(--amber);}

/* ---- password show/hide ---- */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.pw-eye:hover{color:var(--text);}
.pw-eye .ic{width:17px;height:17px;}

/* ---- exam language mode selector ---- */
.qlang-select{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px;flex-shrink:0;}
.qlang-select button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.qlang-select button.active{background:var(--amber);color:#211404;}

.crumb-row .crumb{margin-bottom:0;}

/* ---- month tile notification badge ---- */
.tile{position:relative;}
.notif-badge{

  border:1px solid var(--red);padding:3px 9px 3px 7px;border-radius:20px;font-size:11px;font-weight:700;
  font-family:var(--font-mono);flex-shrink:0;
}
.notif-badge .ic{width:13px;height:13px;}

/* ---- exam completed tick (replaces old "Locked" text badge) ---- */
.done-tick{

}

/* ---- month lock/unlock (admin toggle + guard-side indicator) ---- */
.lock-toggle{

  padding:7px 9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;

}

.lock-toggle.is-locked{color:var(--red);border-color:var(--red);background:var(--red-soft);}
.lock-toggle.is-unlocked{color:var(--green);border-color:var(--green);background:var(--green-soft);}
.lock-toggle:disabled{opacity:.6;cursor:not-allowed;}
.tile.tile-locked{cursor:not-allowed;opacity:.72;}
.tile.tile-locked:hover{border-color:var(--line);transform:none;}
.month-lock-badge{
  display:flex;align-items:center;justify-content:center;

}
.month-lock-badge .ic{width:13px;height:13px;}


/* ---- admin dashboard (animated charts) ---- */
.dash{--dpurple:#8B7CF6;}
.d-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.d-head h2{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.d-head p{margin:0;color:var(--muted);font-size:13px;}
.d-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--green);background:var(--green-soft);border:1px solid var(--green);border-radius:99px;padding:3px 9px;}
.d-live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:dPulse 1.6s ease-out infinite;}
.d-filter{display:flex;align-items:center;gap:8px;}
.d-filter label{font-size:12px;color:var(--muted);font-weight:600;}
.d-filter select{
  min-width:160px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;
}
.d-filter select:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
.d-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px;}
.d-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;transition:.2s transform,.2s border-color,.2s box-shadow;}
.d-kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.08;}
.d-kpi:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 26px -14px rgba(0,0,0,.6);}
.d-kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.d-kpi-ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex-shrink:0;}
.d-kpi-l{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25;}
.d-kpi-n{font-size:28px;font-weight:800;font-family:var(--font-mono);letter-spacing:-.5px;line-height:1.1;}
.d-kpi-n small{font-size:15px;color:var(--muted);margin-left:2px;font-weight:700;}
.d-kpi-sub{font-size:11.5px;color:var(--muted-2);margin-top:6px;}
.d-kpi-bar{height:5px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden;}
.d-kpi-bar i{display:block;height:100%;border-radius:99px;background:var(--c);transform-origin:left;}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px;}
.d-card{padding:18px;min-width:0;}
.d-card.span2{grid-column:span 2;}
.d-card-h h3{margin:0;font-size:15px;}
.d-card-h p{margin:3px 0 12px;font-size:12px;color:var(--muted);}
.d-svg{width:100%;height:auto;display:block;overflow:visible;}
.d-grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;}
.d-axis{fill:var(--muted-2);font-size:10.5px;font-family:var(--font-mono);}
.d-val{fill:var(--text);font-size:11px;font-weight:700;font-family:var(--font-mono);}
.d-dot{fill:var(--panel);stroke:var(--blue);stroke-width:2.2;cursor:pointer;transition:r .15s;}
.d-dot:hover{r:5.5;}
.d-bar{transition:filter .15s;cursor:pointer;} .d-bar:hover{filter:brightness(1.18);}
.d-mini{display:flex;gap:18px;font-size:12px;color:var(--muted);margin:-2px 0 6px;}
.d-mini b{color:var(--text);font-family:var(--font-mono);font-size:15px;margin-right:3px;}
.d-donut{position:relative;width:min(100%,190px);margin:4px auto 12px;}
.d-donut svg{width:100%;display:block;}
.d-seg{transition:stroke-width .15s;cursor:pointer;} .d-seg:hover{stroke-width:5.4;}
.d-donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.d-donut-c b{font-size:26px;font-family:var(--font-mono);font-weight:800;line-height:1.1;}
.d-donut-c span{font-size:11px;color:var(--muted);}
.d-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);}
.d-legend span{display:flex;align-items:center;gap:8px;}
.d-legend i{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.d-legend b{margin-left:auto;color:var(--text);font-family:var(--font-mono);}
.d-hbars{display:flex;flex-direction:column;gap:12px;}
.d-hrow{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr auto;align-items:center;gap:10px;font-size:12.5px;}
.d-hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.d-htrack{height:9px;border-radius:99px;background:var(--line);overflow:hidden;}
.d-hfill{display:block;height:100%;border-radius:99px;transform-origin:left;}
.d-hv{font-family:var(--font-mono);font-weight:700;min-width:64px;text-align:right;}
.d-hv small{color:var(--muted-2);font-weight:500;}
.d-list{display:flex;flex-direction:column;}
.d-li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
.d-li:last-child{border-bottom:0;}
.d-li-b{min-width:0;flex:1;} .d-li-b b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.d-li-b small{color:var(--muted-2);font-size:11.5px;}
.d-rank{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--panel-2);border:1px solid var(--line-2);flex-shrink:0;}
.d-rank.r1{background:var(--amber);color:#2a1a00;border-color:var(--amber);}
.d-rank.r2{background:#c5cee0;color:#1b2234;border-color:#c5cee0;}
.d-rank.r3{background:#cd8a55;color:#2a1608;border-color:#cd8a55;}
.d-avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--blue-soft,rgba(91,141,239,.16));color:var(--blue);flex-shrink:0;}
.d-score{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}
.d-pill{font-family:var(--font-mono);font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);}
.d-empty{padding:34px 10px;text-align:center;color:var(--muted-2);font-size:13px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);}
@media (max-width:1000px){ .d-kpis{grid-template-columns:repeat(2,minmax(0,1fr));} .d-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:700px){ .d-grid{grid-template-columns:1fr;} .d-card.span2{grid-column:auto;} .d-kpi-n{font-size:23px;} .d-hrow{grid-template-columns:1fr auto;} .d-htrack{grid-column:1 / -1;order:3;} }
/* animations only play when the Dashboard is opened (or its month filter is changed) */
@keyframes dRise{from{opacity:0;transform:translateY(16px);}}
@keyframes dBarUp{from{transform:scaleY(0);}}
@keyframes dBarRight{from{transform:scaleX(0);}}
@keyframes dFade{from{opacity:0;}}
@keyframes dDraw{from{stroke-dashoffset:1;}}
@keyframes dSeg{from{stroke-dasharray:0 100;}}
@keyframes dPop{from{opacity:0;transform:scale(0);}}
@keyframes dPulse{0%{box-shadow:0 0 0 0 rgba(63,191,127,.6);}100%{box-shadow:0 0 0 8px rgba(63,191,127,0);}}
.dash-anim .d-rise{animation:dRise .65s cubic-bezier(.22,.9,.32,1) both;animation-delay:var(--d,0ms);}
.dash-anim .d-kpi-bar i{animation:dBarRight 1.1s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(var(--d,0ms) + 250ms);}
.dash-anim .d-bar{transform-box:fill-box;transform-origin:bottom;animation:dBarUp .9s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(600ms + var(--i,0)*90ms);}
.dash-anim .d-val{animation:dFade .5s ease both;animation-delay:calc(1300ms + var(--i,0)*90ms);}
.dash-anim .d-hfill{animation:dBarRight 1s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(700ms + var(--i,0)*100ms);}
.dash-anim .d-line{stroke-dasharray:1;animation:dDraw 1.6s ease-in-out both;animation-delay:.55s;}
.dash-anim .d-area{animation:dFade 1.2s ease both;animation-delay:1.2s;}
.dash-anim .d-dot{transform-box:fill-box;transform-origin:center;animation:dPop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(1.1s + var(--i,0)*70ms);}
.dash-anim .d-seg{animation:dSeg 1.3s cubic-bezier(.22,.9,.32,1) both;animation-delay:calc(650ms + var(--i,0)*180ms);}
@media (prefers-reduced-motion:reduce){ .dash-anim *{animation:none !important;} }

/* ---- exam security mode (no copy / screenshot deterrent) ---- */
body.secure-mode, body.secure-mode *{
  -webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;
}
body.secure-mode ::selection{background:transparent;}
body.secure-mode img{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
body.secure-mode #app{filter:none;transition:filter .12s ease;}
body.secure-mode.secure-blurred #app{filter:blur(22px) saturate(0.6);pointer-events:none;}
.secure-overlay{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(10,15,28,.72);backdrop-filter:blur(2px);padding:24px;
}
body.secure-mode.secure-blurred .secure-overlay{display:flex;}
.secure-overlay-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px;max-width:320px;font-size:13.5px;color:var(--text);line-height:1.5;
}
.secure-overlay-card b{display:block;margin-bottom:6px;color:var(--red);font-size:14px;}
@media print{ body.secure-mode #app, body.secure-mode .topbar, body.secure-mode footer{ display:none!important; } }

/* ---- admin action confirmation popup ---- */
#confirmToastHost{
  position:fixed; left:50%; top:22px; z-index:10000;
  transform:translateX(-50%);
  pointer-events:none;
}
.confirm-toast{
  display:flex; align-items:center; gap:10px;
  background:var(--panel-2);
  border:1px solid var(--green);
  box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 4px var(--green-soft);
  border-radius:999px;
  padding:10px 18px 10px 12px;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  pointer-events:auto;
  opacity:0;
  transform:translateY(-14px) scale(.96);
  transition:opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
}
.confirm-toast.confirm-toast-show{ opacity:1; transform:translateY(0) scale(1); }
.confirm-toast.confirm-toast-hide{ opacity:0; transform:translateY(-10px) scale(.97); }
.confirm-toast-danger{ border-color:var(--red); box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 4px var(--red-soft); }
.confirm-toast-icon{
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  background:var(--green-soft);
}
.confirm-toast-danger .confirm-toast-icon{ background:var(--red-soft); }
.confirm-toast-icon svg{ display:block; }
.ct-circle{
  stroke:var(--green); stroke-width:3;
  stroke-dasharray:145; stroke-dashoffset:145;
  animation:ctCircle .45s ease forwards;
}
.confirm-toast-danger .ct-circle{ stroke:var(--red); }
.ct-check{
  stroke:var(--green); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:34; stroke-dashoffset:34;
  animation:ctCheck .3s .35s ease forwards;
}
.confirm-toast-danger .ct-check{ stroke:var(--red); }
@keyframes ctCircle{ to{ stroke-dashoffset:0; } }
@keyframes ctCheck{ to{ stroke-dashoffset:0; } }
@media (max-width:480px){
  .confirm-toast{ font-size:12.5px; padding:9px 14px 9px 10px; max-width:88vw; white-space:normal; }
}

/* ================= PROFESSIONAL VISUAL REFRESH + MOTION ================= */

/* Page transition — replays only when the visible screen actually changes
   (not on every keystroke or answer click), so search boxes and the exam
   runner stay flicker-free. */
@keyframes pageEnter{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.page-enter{ animation:pageEnter .42s cubic-bezier(.22,.9,.32,1) both; }

/* Depth background */
body{
  background:
    radial-gradient(1100px 560px at 12% -8%, rgba(240,169,59,.09), transparent 60%),
    radial-gradient(900px 520px at 108% 8%, rgba(91,141,239,.08), transparent 55%),
    var(--bg);
}

/* Topbar — glass blur + gradient underline */
.topbar{
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, var(--amber) 20%, var(--blue) 55%, transparent 90%);
  opacity:.6;
}
.brand-icon{
  background:linear-gradient(140deg, #f5b658, var(--amber));
  color:#211404;
  box-shadow:0 0 0 4px var(--amber-soft), 0 4px 14px rgba(240,169,59,.25);
  transition:transform .25s ease, box-shadow .25s ease;
}
.brand:hover .brand-icon{ transform:rotate(-8deg) scale(1.06); box-shadow:0 0 0 5px var(--amber-soft), 0 6px 18px rgba(240,169,59,.35); }

/* Buttons — gradient + glow + shine sweep on hover */
.btn{ position:relative; overflow:hidden; transition:.18s border-color, .18s background, .18s transform, .18s box-shadow; }
.btn-primary{
  background:linear-gradient(135deg, #f5b658, var(--amber));
  box-shadow:0 2px 10px rgba(240,169,59,.22);
}
.btn-primary:hover{ box-shadow:0 6px 18px rgba(240,169,59,.4); transform:translateY(-1px); }
.btn-primary::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 66%);
  transform:translateX(-120%); transition:transform .5s ease;
}
.btn-primary:hover::before{ transform:translateX(120%); }
.btn:active{ transform:scale(.97); }

/* Cards, tiles, role cards — soft depth + lift/glow on hover */
.card{ box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 10px 28px rgba(0,0,0,.18); transition:.2s border-color, .2s box-shadow; }
.tile, .role-card{ box-shadow:0 6px 18px rgba(0,0,0,.16); transition:.2s border-color, .22s transform, .22s box-shadow; }
.tile:hover, .role-card:hover{ box-shadow:0 14px 32px rgba(0,0,0,.28), 0 0 0 1px var(--amber-soft); }
.role-card{ position:relative; overflow:hidden; }
.role-card::after{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:radial-gradient(220px 140px at 30% 0%, rgba(240,169,59,.14), transparent 70%);
  transition:opacity .3s ease;
}
.role-card:hover::after{ opacity:1; }
.role-card .icon{
  background:linear-gradient(135deg, var(--amber-soft), rgba(240,169,59,.28));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.role-card:hover .icon{ transform:scale(1.1) rotate(-4deg); }

/* Hero — floating gradient blobs + gradient headline */
.hero{ position:relative; }
.hero::before, .hero::after{
  content:''; position:absolute; z-index:-1; border-radius:50%; filter:blur(60px); opacity:.5;
  animation:heroFloat 9s ease-in-out infinite;
}
.hero::before{ width:280px; height:280px; background:var(--amber); top:-40px; left:10%; }
.hero::after{ width:240px; height:240px; background:var(--blue); top:20px; right:8%; animation-delay:-4s; }
@keyframes heroFloat{
  0%,100%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(18px) scale(1.06); }
}
.hero h1{
  background:linear-gradient(135deg, var(--text), var(--amber) 130%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* Admin nav — active glow */
.admin-nav button.active{ box-shadow:inset 0 0 0 1px var(--amber-soft); }

/* Score ring — pop-in entrance */
.score-ring{ animation:ringPop .5s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes ringPop{ from{ opacity:0; transform:scale(.7); } to{ opacity:1; transform:scale(1); } }
.score-ring .num{ animation:numFade .4s .22s ease both; }
@keyframes numFade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* Badges — subtle live pulse for "open" state */
.badge-open{ animation:badgePulse 2.2s ease-in-out infinite; }
@keyframes badgePulse{ 0%,100%{ box-shadow:0 0 0 0 var(--amber-soft); } 50%{ box-shadow:0 0 0 5px transparent; } }

/* ---- professional footer ---- */
.site-footer{ margin-top:40px; position:relative; z-index:16; background:var(--panel); border-top:1px solid var(--line); }
.site-footer::before{

/* ================= MOBILE OPTIMISATION ================= */
@media (max-width:600px){
  .wrap, .wrap-narrow{ padding:0 14px; }
  main{ padding:20px 0 40px; }

  /* topbar — keep name / ID / logout from crowding or overlapping the brand */
  .topbar-inner{ padding:10px 14px; gap:8px; }
  .brand{ font-size:14px; gap:8px; min-width:0; }
  .brand > div{ min-width:0; }
  .brand small{ font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-icon{ width:22px; height:22px; }
  .brand-icon .ic{ width:13px; height:13px; }
  .session-chip{ gap:6px; flex-shrink:0; }
  .session-chip .who{ max-width:112px; }
  .session-chip .who b{ font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-chip .who span{ font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }

  .hero h1{ font-size:23px; line-height:1.28; }
  .hero p{ font-size:13px; }
  .hero::before{ width:180px; height:180px; }
  .hero::after{ width:150px; height:150px; }

  /* cards / panels */
  .card{ padding:16px; }
  .panel-head{ gap:10px; }
  .panel-head h2{ font-size:16.5px; }
  .panel-head p{ font-size:12px; }

  /* exam question cards — the main overlap risk area, given extra breathing room */
  .qcard{ padding:15px 14px 14px; }
  .qtext{ font-size:14.5px; line-height:1.5; }
  .qnum{ width:22px; height:22px; font-size:11px; margin-right:8px; }
  .opt{ padding:10px 11px; font-size:13px; gap:9px; }
  .opt .letter{ width:20px; height:20px; font-size:10.5px; }
  .exam-meta{ gap:8px; }
  .qlang-select button, .lang-toggle button{ padding:6px 10px; font-size:11px; }

  /* item rows / admin lists — labels and action buttons stack instead of overlapping */
  .item-row{ flex-wrap:wrap; padding:12px 13px; }
  .item-row .actions{ width:100%; justify-content:flex-end; }
  .q-edit-row{ padding:12px 13px; }
  .q-edit-row .qtop{ flex-wrap:wrap; }

  /* admin section nav */
  .admin-nav button{ font-size:12.5px; padding:9px 11px; gap:10px; }
  .admin-nav button .ic{ width:32px; height:32px; border-radius:9px; }

  /* results table — smaller but still fully legible, scrolls horizontally */
  table{ font-size:12.5px; }
  thead th{ padding:9px 11px; font-size:10.5px; }
  tbody td{ padding:9px 11px; }

  /* score ring */
  .score-ring{ width:118px; height:118px; }
  .score-ring .num{ font-size:27px; }

  /* footer */
  .footer-inner{ padding:22px 14px 16px; }
  .footer-brand p{ max-width:none; }
  .footer-bottom{ padding:12px 14px; font-size:11px; }
}
@media (max-width:360px){
  /* smallest phones only — drop the name/ID chip so nothing crowds the logout button */
  .session-chip .who{ display:none; }
  .brand small{ display:none; }
}

<body>

<div class="secure-overlay" id="secureOverlay"><div class="secure-overlay-card"><b>Screen protected</b>This exam screen is protected. Return to this tab/window for the content to reappear.</div></div>
<script>
const DEMO_LS=(function(){const m={};return{getItem:k=>Object.prototype.hasOwnProperty.call(m,k)?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}})();
/* =========================================================
   SECURITY EXAM PORTAL
   Storage: Supabase (shared cloud database).
   Session (who's logged in on this device) still uses
   DEMO_LS — that's just this browser's login state.
   ========================================================= */

const POSTS = ["SO","SS","SG","CO"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const EXAM_TYPES = ["Pre SOP","Post SOP","Pre Psara","Post Psara","Pre OJT","Post OJT","Human rights","Other"];

/* =========================================================
   Supabase-backed storage.
   Local `DB` stays an in-memory cache with the exact same
   shape/field names the rest of the app already uses
   (camelCase) — only the load/save layer talks to Supabase.
   ========================================================= */
/* =====================================================================
   DEMO BACKEND — runs entirely in this page's memory.
   It imitates the small part of the Supabase client that this app uses,
   with fake data. Nothing is sent to, or saved on, any server.
   ===================================================================== */
const sb = (function(){
  const clone = o => JSON.parse(JSON.stringify(o));
  const err = m => ({ data:null, error:{ message:m } });
  const ok  = d => ({ data:d, error:null });
  const ADMIN_TOKEN = 'demo-admin-token';

  /* ---------- fake data (deterministic) ---------- */
  let _s = 20261028;
  const rnd = () => { _s = (_s*1664525 + 1013904223) >>> 0; return _s/4294967296; };
  const ri = n => Math.floor(rnd()*n);
  const T = { months:[], exams:[], questions:[], attempts:[], guards:[], admins:[], settings:[], keys:{} };
  const iso = t => new Date(t).toISOString();
  const NOW = Date.now(), today = new Date(NOW);

  T.admins.push({ mobile:'9000000001', name:'Demo Admin', password:'demo' });

  /* sample security personnel — all names / numbers are made up */
  const NAMES = ['Rahul Verma','Amit Kumar Sahu','Sanjay Yadav','Vijay Kumar Dewangan','Manoj Kumar Patel','Rakesh Tiwari','Deepak Kumar Sinha','Suresh Chandra Netam','Anil Kumar Rathore','Pankaj Kumar Sharma','Mukesh Kumar Singh','Dinesh Kumar Sahu','Rajendra Prasad Verma','Naveen Kumar Thakur','Ashok Kumar Kashyap','Pramod Kumar Jaiswal','Santosh Kumar Mishra','Ramesh Kumar Chauhan','Bhupendra Singh Rajput','Kamlesh Kumar Dhruw','Hemant Kumar Sonwani','Yogesh Kumar Tandon','Lokesh Kumar Banjare','Tarun Kumar Gupta'];
  const POSTS_ = ['SO','SS','SG','CO'];
  NAMES.forEach((n,i)=>{
    T.guards.push({ mobile:'90000'+String(10001+i), name:n, gate_pass:String(20240101+i*7), post:POSTS_[i%4],
      pin:'1234', registered_at: iso(NOW - (200 - i*5)*86400000), seen_exams:[] });
  });
  const DEMO_GUARD = T.guards[0];

  /* bilingual question bank: [EN, HI, [[en,hi]×4], correctIndex] */
  const BANK = [
   ['What is the first action when you find an unattended bag near the gate?','गेट के पास लावारिस बैग मिलने पर सबसे पहले क्या करना चाहिए?',[['Open it and check inside','अंदर देखने के लिए खोलें'],['Keep people away and inform the control room immediately','लोगों को दूर रखें और तुरंत कंट्रोल रूम को सूचित करें'],['Ignore it','अनदेखा करें'],['Move it to the guard room','गार्ड रूम में ले जाएँ']],1],
   ['A visitor arrives without a valid gate pass. What should you do?','किसी आगंतुक के पास वैध गेट पास नहीं है। आपको क्या करना चाहिए?',[['Allow entry just this once','इस बार प्रवेश दे दें'],['Do not allow entry and direct him to the pass office','प्रवेश न दें और उसे पास ऑफिस भेजें'],['Let him in without any record','बिना रिकॉर्ड के अंदर जाने दें'],['Ask him to come back at night','उसे रात में आने को कहें']],1],
   ['What does HHMD stand for?','HHMD का पूरा नाम क्या है?',[['Hand Held Metal Detector','हैंड हेल्ड मेटल डिटेक्टर'],['High Heat Monitoring Device','हाई हीट मॉनिटरिंग डिवाइस'],['Hand Held Mobile Device','हैंड हेल्ड मोबाइल डिवाइस'],['Heavy Hazard Material Detector','हेवी हैज़र्ड मैटेरियल डिटेक्टर']],0],
   ['Which check is mandatory before a vehicle enters the plant?','वाहन को प्लांट में प्रवेश देने से पहले कौन-सी जाँच अनिवार्य है?',[['Checking vehicle documents and a physical search','वाहन के दस्तावेज़ों की जाँच और तलाशी'],['Checking only the colour','केवल रंग देखना'],['Noting only the number plate','केवल नंबर नोट करना'],['No check for company vehicles','कंपनी के वाहनों की जाँच ज़रूरी नहीं']],0],
   ['If a person is suspected to be intoxicated at the gate, you should:','यदि गेट पर किसी व्यक्ति के नशे में होने का संदेह हो, तो आपको:',[['Allow entry and keep watching him','प्रवेश देकर उस पर नज़र रखनी चाहिए'],['Deny entry, test with the BCA machine and report to the supervisor','प्रवेश नहीं देना चाहिए, BCA मशीन से जाँच करनी चाहिए और सुपरवाइज़र को बताना चाहिए'],['Send him inside with a colleague','साथी के साथ अंदर भेज देना चाहिए'],['Ignore it','अनदेखा करना चाहिए']],1],
   ['What should you do first when the fire alarm sounds?','फायर अलार्म बजने पर सबसे पहले क्या करें?',[['Leave quietly','चुपचाप चले जाएँ'],['Raise the alarm, inform the control room and guide people to the assembly point','अलार्म बजाएँ, कंट्रोल रूम को सूचित करें और लोगों को असेंबली पॉइंट तक पहुँचाएँ'],['Wait for orders','आदेश की प्रतीक्षा करें'],['Switch off the CCTV','सीसीटीवी बंद कर दें']],1],
   ['Why is the visitor register maintained?','विज़िटर रजिस्टर क्यों रखा जाता है?',[['For decoration','सजावट के लिए'],['To keep an accurate record of who entered and left','कौन आया और गया, इसका सही रिकॉर्ड रखने के लिए'],['Only for the manager to read','केवल मैनेजर के पढ़ने के लिए'],['It is not required','इसकी आवश्यकता नहीं है']],1],
   ['During a personal search you must:','व्यक्तिगत तलाशी के दौरान आपको:',[['Behave politely and follow the SOP','शिष्टता से व्यवहार करना चाहिए और SOP का पालन करना चाहिए'],['Use force','बल प्रयोग करना चाहिए'],['Shout at the person','व्यक्ति पर चिल्लाना चाहिए'],['Skip the search','तलाशी छोड़ देनी चाहिए']],0],
   ['A boom barrier stops working. What is the correct step?','बूम बैरियर काम करना बंद कर दे तो सही कदम क्या है?',[['Leave the gate open and walk away','गेट खुला छोड़कर चले जाएँ'],['Operate it manually, inform the supervisor and log the fault','मैनुअल चलाएँ, सुपरवाइज़र को बताएँ और खराबी दर्ज करें'],['Ignore it until tomorrow','कल तक अनदेखा करें'],['Close the gate permanently','गेट हमेशा के लिए बंद कर दें']],1],
   ['What is the purpose of CCTV monitoring in the control room?','कंट्रोल रूम में सीसीटीवी निगरानी का उद्देश्य क्या है?',[['Entertainment','मनोरंजन'],['Early detection of suspicious activity and quick response','संदिग्ध गतिविधि का जल्दी पता लगाना और तुरंत कार्रवाई'],['Recording sports events','खेल रिकॉर्ड करना'],['Decoration','सजावट']],1],
   ['What should you do with a lost item that you find?','कोई गुमशुदा सामान मिलने पर क्या करना चाहिए?',[['Keep it','अपने पास रख लें'],['Deposit it at the security office and make an entry in the register','सुरक्षा कार्यालय में जमा करें और रजिस्टर में प्रविष्टि करें'],['Throw it away','फेंक दें'],['Give it to any passer-by','किसी भी राहगीर को दे दें']],1],
   ['Who should be informed first about a serious security incident?','गंभीर सुरक्षा घटना की सूचना सबसे पहले किसे देनी चाहिए?',[['A friend','किसी मित्र को'],['The control room and the shift supervisor','कंट्रोल रूम और शिफ्ट सुपरवाइज़र को'],['Social media','सोशल मीडिया पर'],['Nobody','किसी को नहीं']],1],
   ['Using a mobile phone for personal calls while on duty is:','ड्यूटी के दौरान निजी कॉल के लिए मोबाइल फोन का उपयोग:',[['Allowed at any time','किसी भी समय अनुमत है'],['Not allowed at the post, except in an emergency','आपातकाल को छोड़कर पोस्ट पर अनुमत नहीं है'],['Allowed if the post is quiet','पोस्ट शांत हो तो अनुमत है'],['Compulsory','अनिवार्य है']],1],
   ['What is the correct way to hand over a shift?','शिफ्ट हैंडओवर का सही तरीका क्या है?',[['Leave without informing anyone','बिना बताए चले जाएँ'],['Brief the incoming guard and sign the handover register','आने वाले गार्ड को जानकारी दें और हैंडओवर रजिस्टर पर हस्ताक्षर करें'],['Give the keys to a stranger','चाबियाँ किसी अनजान को दे दें'],['Only send a message','केवल मैसेज भेज दें']],1],
   ['What does PPE stand for?','PPE का पूरा नाम क्या है?',[['Personal Protective Equipment','पर्सनल प्रोटेक्टिव इक्विपमेंट'],['Plant Power Engine','प्लांट पावर इंजन'],['Public Police Entry','पब्लिक पुलिस एंट्री'],['Primary Patrol Exercise','प्राइमरी पैट्रोल एक्सरसाइज़']],0],
   ["A contractor's vehicle is taking material out of the plant. What is required?",'ठेकेदार का वाहन प्लांट से सामान बाहर ले जा रहा है। क्या आवश्यक है?',[['A valid material gate pass','वैध मटेरियल गेट पास'],['Nothing','कुछ नहीं'],['Verbal permission only','केवल मौखिक अनुमति'],['A phone call from anyone','किसी का भी फोन कॉल']],0]
  ];

  /* last 3 months (oldest one is locked, to show the lock feature) */
  const EXAM_DEFS = [['Pre SOP Assessment','Pre SOP'],['Post SOP Assessment','Post SOP'],['Human Rights & Conduct','Human rights']];
  const MONTH_NAMES_ = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  let qSeq = 0, aSeq = 0;
  for(let k=2;k>=0;k--){
    const d = new Date(today.getFullYear(), today.getMonth()-k, 1);
    const mid = 'mo_demo'+(3-k);
    T.months.push({ id:mid, label:MONTH_NAMES_[d.getMonth()]+' '+d.getFullYear(), month_num:d.getMonth(), year:d.getFullYear(), created_at:iso(d.getTime()+3600000), locked: k===2 });
    EXAM_DEFS.forEach((ed,ei)=>{
      const eid = 'ex_demo'+(3-k)+'_'+(ei+1);
      T.exams.push({ id:eid, month_id:mid, name_en:ed[0], name_hi:ed[0], exam_type:ed[1], q_lang:'both', show_name_en:true, show_name_hi:false, locked:false, created_at:iso(d.getTime()+3600000+ei*60000) });
      for(let qi=0; qi<8; qi++){
        const b = BANK[(qi + ei*5 + (2-k)*3) % BANK.length];
        /* shuffle the options (seeded) and remember where the right one went */
        const idx = [0,1,2,3]; for(let i=3;i>0;i--){ const j=ri(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
        const qid = 'q_demo'+(++qSeq);
        T.questions.push({ id:qid, exam_id:eid, order:qi, text_en:b[0], text_hi:b[1], opt_type:'text',
          options: idx.map(o=>({en:b[2][o][0], hi:b[2][o][1]})), published:true, created_at:iso(d.getTime()+3600000+qi*1000) });
        T.keys[qid] = idx.indexOf(b[3]);
      }
    });
  }

  /* fake exam attempts: older months mostly complete; the demo person has none this month */
  const curMonth = T.months[2].id;
  T.exams.forEach(ex=>{
    const m = T.months.find(x=>x.id===ex.month_id), isCur = m.id===curMonth;
    const qs = T.questions.filter(q=>q.exam_id===ex.id).sort((a,b)=>a.order-b.order);
    T.guards.forEach((g,gi)=>{
      if(isCur && gi===0) return;                       // demo person can take this month's exams
      if(rnd() > (isCur ? .55 : .85) && !(gi===0)) return;
      const skill = .38 + rnd()*.55;
      const answers = qs.map(q => rnd()<skill ? T.keys[q.id] : (T.keys[q.id]+1+ri(3))%4);
      const score = answers.reduce((s,a,i)=>s+(a===T.keys[qs[i].id]?1:0),0);
      let ts = new Date(m.year, m.month_num, 2+ri(isCur ? Math.max(1,today.getDate()-2) : 24), 8+ri(10), ri(60)).getTime();
      if(ts > NOW) ts = NOW - (1+ri(20))*3600000;
      T.attempts.push({ id:'att_demo'+(++aSeq), guard_mobile:g.mobile, exam_id:ex.id, lang:rnd()<.3?'hi':'en', answers, score, total:qs.length, submitted_at:iso(ts) });
    });
  });
  /* the demo person has already seen last months' exams, but not this month's (shows the "new exam" badge) */
  DEMO_GUARD.seen_exams = T.exams.filter(e=>e.month_id!==curMonth).map(e=>e.id);
  T.guards.forEach((g,i)=>{ if(i>0) g.seen_exams = T.exams.map(e=>e.id); });

  /* ---------- tiny query builder (select only) ---------- */
  function rowsOf(t){
    if(t==='guards_public') return T.guards.map(g=>{ const c=Object.assign({},g); delete c.pin; return c; });
    return T[t] || [];
  }
  function builder(tbl){
    const q = { f:[], ord:null, rg:null, cnt:false, head:false, one:false };
    const api = {
      select(c,o){ if(o&&o.count) q.cnt=true; if(o&&o.head) q.head=true; return api; },
      eq(c,v){ q.f.push(r=>r[c]===v); return api; },
      in(c,a){ q.f.push(r=>a.includes(r[c])); return api; },
      order(c){ q.ord=c; return api; },
      range(a,b){ q.rg=[a,b]; return api; },
      maybeSingle(){ q.one=true; return api; },
      then(res,rej){ return Promise.resolve().then(run).then(res,rej); }
    };
    function run(){
      let rows = rowsOf(tbl).filter(r=>q.f.every(f=>f(r)));
      const count = rows.length;
      if(q.ord){ const c=q.ord; rows = rows.slice().sort((a,b)=> a[c]<b[c]?-1:a[c]>b[c]?1:0); }
      if(q.rg) rows = rows.slice(q.rg[0], q.rg[1]+1);
      if(q.head) return { data:null, count, error:null };
      rows = clone(rows);
      return { data: q.one ? (rows[0]||null) : rows, count, error:null };
    }
    return api;
  }

  /* ---------- "server functions" ---------- */
  const guardOut = g => ({ mobile:g.mobile, name:g.name, gate_pass:g.gate_pass, post:g.post, seen_exams:g.seen_exams||[], registered_at:g.registered_at });
  const RPC = {
    /* demo: any mobile/PIN (even empty) signs in — an unknown or empty mobile opens the sample person */
    verify_guard_login(a){
      const g = T.guards.find(x=>x.mobile===String(a.p_mobile||'').trim()) || DEMO_GUARD;
      return ok([guardOut(g)]);
    },
    register_guard(a){
      if(T.guards.some(g=>g.mobile===a.p_mobile)) return err('MOBILE_EXISTS');
      if(T.guards.some(g=>g.gate_pass===a.p_gate_pass)) return err('GATEPASS_EXISTS');
      const g = { mobile:a.p_mobile, name:a.p_name, gate_pass:a.p_gate_pass, post:a.p_post, pin:a.p_pin, registered_at:iso(Date.now()), seen_exams:[] };
      T.guards.push(g); return ok([guardOut(g)]);
    },
    mark_exams_seen(a){
      const g = T.guards.find(x=>x.mobile===a.p_mobile); if(g) g.seen_exams = Array.from(new Set([...(g.seen_exams||[]), ...(a.p_exam_ids||[])]));
      return ok(null);
    },
    submit_exam(a){
      if(T.attempts.some(x=>x.guard_mobile===a.p_mobile && x.exam_id===a.p_exam_id)) return err('ALREADY_ATTEMPTED');
      const qs = T.questions.filter(q=>q.exam_id===a.p_exam_id && q.published!==false).sort((x,y)=>x.order-y.order);
      const answers = a.p_answers||[];
      const score = qs.reduce((s,q,i)=>s+(answers[i]===T.keys[q.id]?1:0),0);
      const row = { id:a.p_id, guard_mobile:a.p_mobile, exam_id:a.p_exam_id, lang:a.p_lang, answers, score, total:qs.length, submitted_at:iso(Date.now()) };
      T.attempts.push(row); return ok(clone(row));
    },
    get_attempt_review(a){
      const at = T.attempts.find(x=>x.id===a.p_attempt_id); if(!at) return ok([]);
      const qs = T.questions.filter(q=>q.exam_id===at.exam_id && q.published!==false).sort((x,y)=>x.order-y.order);
      return ok(qs.map((q,i)=>at.answers[i]===T.keys[q.id]));
    },
    verify_admin_login(){ const a=T.admins[0]; return ok([{ mobile:a.mobile, name:a.name }]); },
    admin_issue_token(){ return ok(ADMIN_TOKEN); },
    admin_get_keys(a){
      if(a.p_token!==ADMIN_TOKEN) return err('ADMIN_AUTH_FAILED');
      return ok(Object.keys(T.keys).map(id=>({ question_id:id, correct:T.keys[id] })));
    },
    admin_set_question_key(a){
      if(a.p_token!==ADMIN_TOKEN) return err('ADMIN_AUTH_FAILED');
      T.keys[a.p_question_id] = a.p_correct; return ok(null);
    },
    admin_reset_guard_pin(a){
      const g = T.guards.find(x=>x.mobile===a.p_guard_mobile); if(g) g.pin = a.p_new_pin; return ok(null);
    },
    admin_write(a){
      if(a.p_token!==ADMIN_TOKEN) return err('ADMIN_AUTH_FAILED');
      const t = T[a.p_table]; if(!Array.isArray(t)) return err('Unknown table: '+a.p_table);
      const match = a.p_match||{}, d = a.p_data;
      const isM = r => Object.keys(match).every(k=>Array.isArray(match[k]) ? match[k].includes(r[k]) : r[k]===match[k]);
      let out = [];
      if(a.p_op==='insert'){ const r=clone(d); t.push(r); out=[r]; }
      else if(a.p_op==='upsert'){
        const key = a.p_table==='guards' ? 'mobile' : 'id', i = t.findIndex(r=>r[key]===d[key]);
        if(i>=0){ Object.assign(t[i], clone(d)); out=[t[i]]; } else { const r=clone(d); t.push(r); out=[r]; }
      }
      else if(a.p_op==='update'){
        if(a.p_table==='guards' && d.gate_pass && t.some(g=>g.gate_pass===d.gate_pass && !isM(g))) return err('duplicate key GATEPASS');
        t.forEach(r=>{ if(isM(r)){ Object.assign(r, clone(d)); out.push(r); } });
      }
      else if(a.p_op==='delete'){
        for(let i=t.length-1;i>=0;i--) if(isM(t[i])){ out.push(t[i]); t.splice(i,1); }
        /* cascade, like the real database would */
        const killEx = ids => { T.exams = T.exams.filter(e=>!ids.includes(e.id)); const qid=T.questions.filter(q=>ids.includes(q.exam_id)).map(q=>q.id); qid.forEach(x=>delete T.keys[x]); T.questions = T.questions.filter(q=>!ids.includes(q.exam_id)); T.attempts = T.attempts.filter(x=>!ids.includes(x.exam_id)); };
        if(a.p_table==='months'){ const mids = out.map(m=>m.id); killEx(T.exams.filter(e=>mids.includes(e.month_id)).map(e=>e.id)); }
        if(a.p_table==='exams') killEx(out.map(e=>e.id));
        if(a.p_table==='questions') out.forEach(q=>delete T.keys[q.id]);
      }
      return ok(clone(out));
    }
  };

  /* ---------- in-memory file "storage" ---------- */
  const BLOBS = {};
  const storage = { from(){ return {
    upload(path, file){ try{ BLOBS[path] = URL.createObjectURL(file); }catch(e){} return Promise.resolve({ data:{ path }, error:null }); },
    getPublicUrl(path){ return { data:{ publicUrl: BLOBS[path] || '' } }; },
    remove(){ return Promise.resolve({ data:[], error:null }); }
  }; } };

  return {
    from: t => builder(t),
    rpc: (name, args) => Promise.resolve().then(()=>{ try{ return RPC[name] ? RPC[name](args||{}) : err('Unknown function '+name); }catch(e){ return err(String(e&&e.message||e)); } }),
    storage,
    channel(){ const c = { on(){ return c; }, subscribe(){ return c; } }; return c; },
    removeChannel(){}
  };
})();

function toCamel(row){
  const out = {};
  for(const k in row){
    const ck = k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
    let v = row[k];
    /* timestamptz columns (registeredAt/createdAt/submittedAt) come back
       as ISO strings from Supabase — convert to epoch-ms numbers since the
       rest of the app sorts/formats these as numbers (Date.now()-style) */
    if(/At$/.test(ck) && typeof v === 'string'){ const t = new Date(v).getTime(); if(!isNaN(t)) v = t; }
    out[ck] = v;
  }
  return out;
}
function toSnake(obj){
  const out = {};
  for(const k in obj){
    let v = obj[k];
    /* reverse of the above: epoch-ms numbers -> ISO strings before sending
       to a timestamptz column, otherwise Postgres rejects the raw number */
    if(/At$/.test(k) && typeof v === 'number'){ v = new Date(v).toISOString(); }
    out[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())] = v;
  }
  return out;
}
function guardRowToObj(row){ return toCamel(row); }
function guardObjToRow(o){ return toSnake(o); }
function adminRowToObj(row){ const o = toCamel(row); o.password = o.passwordHash; delete o.passwordHash; return o; }
function adminObjToRow(o){ const c = Object.assign({}, o); c.passwordHash = c.password; delete c.password; return toSnake(c); }

/* ---- answer keys live in a separate server table (question_keys). Only a
   logged-in admin (token) can read them; guards never receive them. ---- */
const REVIEW_FLAGS = {}; // attemptId -> [true/false per question], from the server
async function mergeAdminKeys(){
  if(!SESSION || SESSION.role!=='admin') return;
  if(!SESSION.token){ clearSession(); location.reload(); return; } // old session without token: log in again
  const { data, error } = await sb.rpc('admin_get_keys', {p_token: SESSION.token});
  if(error){
    if(String(error.message||'').includes('ADMIN_AUTH_FAILED')){ clearSession(); alert('Admin session expired. Please log in again.'); location.reload(); return; }
    throw error;
  }
  const map = {}; (data||[]).forEach(r=>{ map[r.question_id] = r.correct; });

/* ---- admin writes go through ONE server function (admin_write) that checks
   the admin token and only allows specific tables/operations. ---- */
async function adminDb(table, op, data, match){
  if(!SESSION || !SESSION.token){
    clearSession(); alert('Admin session expired. Please log in again.'); location.reload();
    return { data:null, error:{ message:'ADMIN_AUTH_FAILED' } };
  }
  const { data: res, error } = await sb.rpc('admin_write', {
    p_token: SESSION.token, p_table: table, p_op: op, p_data: data||null, p_match: match||null
  });
  if(error && String(error.message||'').includes('ADMIN_AUTH_FAILED')){
    clearSession(); alert('Admin session expired. Please log in again.'); location.reload();
  }
  return { data: res, error };
}
/* same return shape as dbWrite(): {ok, data, error} */
async function dbWriteAdmin(table, op, data, match, label){
  try{
    const { data: res, error } = await adminDb(table, op, data, match);
    if(error) return { ok:false, error };
    if(!res || res.length===0){
      return { ok:false, error:{ message:`The database did not apply this change (0 rows affected) on the "${label||table}" table.` } };
    }
    return { ok:true, data:res };
  }catch(error){ return { ok:false, error }; }
}
/* Supabase returns max 1000 rows per request. fetchAllRows pages through so that
   1-2 saal ka data (hazaaron attempts/questions) kabhi chupchaap kat na jaye. */
async function fetchAllRows(makeQuery, orderCol){
  const PAGE = 1000; let from = 0; const out = [];
  while(true){
    const { data, error } = await makeQuery().order(orderCol).range(from, from+PAGE-1);
    if(error) throw error;
    const rows = data||[]; out.push(...rows);
    if(rows.length < PAGE) break;
    from += PAGE;
  }
  return out;
}
/* Guards ke liye questions lazy-load hote hain (sirf wahi exam jo khola ja raha hai) */
const Q_LOADED = {}, Q_ERR = {}; let QLOAD_BUSY = false;
function guardRequiredExamIds(){
  if(!SESSION || SESSION.role!=='guard' || !S) return [];
  let ids = [];
  if(S.screen==='guard-month') ids = examsForMonth(S.monthId).map(e=>e.id);
  else if(S.screen==='guard-exam-lang' || S.screen==='guard-exam-run') ids = [S.examId];
  else if(S.screen==='guard-review'){ const a = DB.attempts.find(x=>x.id===S.attemptId); if(a) ids = [a.examId]; }
  const now = Date.now();
  return ids.filter(id=>{
    if(!id) return false;
    if(Q_LOADED[id] && (S.screen==='guard-exam-run' || now-Q_LOADED[id] < 180000)) return false;
    if(Q_ERR[id] && now-Q_ERR[id] < 15000) return false;
    return true;
  });
}
async function loadGuardQuestions(ids){
  try{
    const rows = await fetchAllRows(()=>sb.from('questions').select('*').in('exam_id', ids),'id');
    const set = new Set(ids);
    DB.questions = DB.questions.filter(q=>!set.has(q.examId)).concat(rows.map(toCamel));
    ids.forEach(id=>{ Q_LOADED[id] = Date.now(); delete Q_ERR[id]; });
  }catch(err){ console.error('question load failed', err); ids.forEach(id=>{ Q_ERR[id] = Date.now(); }); }
}
async function loadAllData(){
  /* admins table is intentionally NOT fetched here (admin login goes through RPC).
     Admin: sab kuch (paginated). Guard: months + exams + sirf apne attempts + apni guard row.
     Logged-out: sirf months + exams. Questions guards ke liye lazy-load hote hain. */
  const role = SESSION && SESSION.role;
  const mJob = fetchAllRows(()=>sb.from('months').select('*'),'id');
  const eJob = fetchAllRows(()=>sb.from('exams').select('*'),'id');
  if(role==='admin'){
    const [m,e,g,q,at] = await Promise.all([
      mJob, eJob,
      fetchAllRows(()=>sb.from('guards_public').select('*'),'mobile'),
      fetchAllRows(()=>sb.from('questions').select('*'),'id'),
      fetchAllRows(()=>sb.from('attempts').select('*'),'id'),
    ]);
    DB.guards = g.map(guardRowToObj);
    DB.months = m.map(toCamel);
    DB.exams = e.map(toCamel);
    DB.questions = q.map(toCamel);
    DB.attempts = at.map(toCamel);
    await mergeAdminKeys();
    return;
  }
  if(role==='guard'){
    const [m,e,at,gr] = await Promise.all([
      mJob, eJob,
      fetchAllRows(()=>sb.from('attempts').select('*').eq('guard_mobile', SESSION.mobile),'id'),
      sb.from('guards_public').select('*').eq('mobile', SESSION.mobile),
    ]);
    if(gr.error) throw gr.error;
    DB.months = m.map(toCamel);
    DB.exams = e.map(toCamel);
    DB.attempts = at.map(toCamel);
    if(gr.data && gr.data.length) DB.guards = gr.data.map(guardRowToObj);
    return;
  }
  const [m,e] = await Promise.all([mJob, eJob]);
  DB.months = m.map(toCamel);
  DB.exams = e.map(toCamel);
}
async function withBusy(form, fn){
  const btn = form.querySelector('button[type="submit"]');
  const orig = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{ await fn(); }
  catch(err){ console.error(err); alert('Something went wrong, please try again.\n' + (err&&err.message?err.message:err)); }
  finally{ if(btn){ btn.disabled = false; if(orig!=null) btn.textContent = orig; } }
}
/* ---- confirmation popup: shown after an admin action has actually been
   saved to the database, so the admin gets clear visual proof that what
   they clicked (add question, delete, lock, publish, etc.) has gone
   through. Auto-dismisses; can also be tapped/clicked to close early. */
let CONFIRM_TOAST_TIMER = null;
function showConfirmToast(message, kind){
  let host = document.getElementById('confirmToastHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'confirmToastHost';
    host.setAttribute('aria-live','polite');
    document.body.appendChild(host);
  }
  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'confirm-toast' + (kind==='danger' ? ' confirm-toast-danger' : '');
  card.innerHTML = `
    <span class="confirm-toast-icon">
      <svg viewBox="0 0 52 52" width="22" height="22"><circle class="ct-circle" cx="26" cy="26" r="23" fill="none"/><path class="ct-check" fill="none" d="M14 27l7 7 17-17"/></svg>
    </span>
    <span class="confirm-toast-msg">${message}</span>
  `;
  card.addEventListener('click', ()=> dismissConfirmToast());
  host.appendChild(card);
  requestAnimationFrame(()=> card.classList.add('confirm-toast-show'));
  if(CONFIRM_TOAST_TIMER) clearTimeout(CONFIRM_TOAST_TIMER);
  CONFIRM_TOAST_TIMER = setTimeout(dismissConfirmToast, 2600);
}
function dismissConfirmToast(){
  const host = document.getElementById('confirmToastHost');
  if(!host) return;
  const card = host.querySelector('.confirm-toast');
  if(!card) return;
  card.classList.remove('confirm-toast-show');
  card.classList.add('confirm-toast-hide');
  setTimeout(()=>{ if(host) host.innerHTML=''; }, 220);
}
/* ---- write helper: confirms a Supabase write actually changed a row.
   With Row Level Security enabled, a write that a policy silently blocks
   comes back from Postgrest with NO error at all — just 0 rows affected.
   Every insert/update/delete in this app used to trust `error` alone, so a
   blocked write looked identical to a successful one: the UI updated
   optimistically and told the user it worked, but nothing was saved in
   Postgres — the change then quietly "undid itself" the next time the
   page (or another device) reloaded fresh data. Routing every write
   through here turns that silent failure into a visible, honest error. */
async function dbWrite(query, selectCols, tableLabel){
  try{
    const { data, error } = await query.select(selectCols||'*');
    if(error) return { ok:false, error };
    if(!data || data.length===0){
      const where = tableLabel ? ` on the "${tableLabel}" table` : ' on this table';
      return { ok:false, error:{ message:`The database did not apply this change (0 rows affected). This almost always means a Row Level Security (RLS) policy${where} is blocking the write — open the Supabase SQL editor and make sure a DELETE policy exists${where} for the anon role (see the SQL block your developer gave you).` } };
    }
    return { ok:true, data };
  }catch(error){
    return { ok:false, error };
  }
}
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDateTime(ts){

function fmtRegAt(ts){ if(!ts) return '-'; const d=fmtDateTime(ts); return d.date+', '+d.time; }
function pctStr(a,b){ const x=Number(a)||0, y=Number(b)||0; if(y<=0) return '0%'; const v=Math.min(100,x/y*100); return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,'')+'%'; }

      return [i+1, `<span class="name-link" data-profile="${esc(a.guardMobile)}">${esc(g?g.name:a.guardMobile)}</span>`, esc(g?g.gatePass:'-'), esc(g?g.post:'-'), esc(m?m.label:'-'), esc(ex?(ex.examType||examLabel(ex)):'-'), dt.date+' '+dt.time, a.score+'/'+a.total, pctStr(a.score,a.total), resultBadgeHtml(a.score,a.total)]; });
    mono = [0,2,6,7,8];
  }
  return `
  <div class="card">
    <div class="panel-head"><div><h2>${esc(title)} (${rows.length})</h2>${suffix?`<p>${esc(suffix)}</p>`:''}</div></div>
    <div class="search-box"><input type="text" id="mdSearchInput" placeholder="Search…" value="${esc(searchVal||'')}"></div>
    ${rows.length===0?emptyState('search','Nothing found','Check the spelling and try again.'):
    `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${r.map((c,i)=>`<td${mono.includes(i)?' class="mono"':''}>${c}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`}
  </div>`;
}

/* ---- pass / fail helpers (pass mark = 33% of combined marks of the latest attempt in each exam) ---- */
function guardMarksIn(mobile, exList){
  let ach=0, tot=0;
  exList.forEach(ex=>{ const la = latestAttempt(mobile, ex.id); if(la){ ach += la.score; tot += la.total; } });
  return {ach, tot};
}
function passFailFor(mobiles, exList){
  let pass=0, fail=0;
  mobiles.forEach(m=>{ const t = guardMarksIn(m, exList); if(t.tot>0){ if(isPassed(t.ach,t.tot)) pass++; else fail++; } });
  return {pass, fail};
}
function masterDataPassFail(){
  const { attend } = masterDataAttendance();
  const { examsToCheck } = masterDataExamsToCheck();
  const pass=[], fail=[];
  attend.forEach(g=>{
    const m = guardMarksIn(g.mobile, examsToCheck);
    const row = {g, achievedMarks:m.ach, totalMarks:m.tot, pct: m.tot>0 ? m.ach/m.tot*100 : 0};
    (isPassed(m.ach,m.tot) ? pass : fail).push(row);
  });
  const byPct = (a,b)=>b.pct-a.pct;
  return { pass: pass.sort(byPct), fail: fail.sort(byPct) };
}
function downloadWorkbook(wb, filename){
  const blob = new Blob([XLSX.write(wb,{bookType:'xlsx', type:'array'})], {type:'application/octet-stream'});
  if(window.claude){
    claude.use('downloads').then(dl=>{
      if(!dl){ fallbackDownload(blob, filename); return; }
      dl.save({filename, data: blob}).catch(()=>fallbackDownload(blob, filename));
    }).catch(()=>fallbackDownload(blob, filename));
  } else {
    fallbackDownload(blob, filename);
  }
}
function letter(i){ return ['A','B','C','D'][i] || '-'; }
/* ---- Pass / Fail: passing mark = 33% of total marks, ALWAYS rounded UP
   (100 -> 33, 20 -> 7 (6.6), 10 -> 4 (3.3)). Integer maths avoids float errors. ---- */
const PASS_PERCENT = 33;
function passMarkFor(total){ const t = Number(total)||0; return Math.ceil(t*PASS_PERCENT/100); }
function isPassed(score, total){ return (Number(score)||0) >= passMarkFor(total); }
function resultWord(score, total){ return isPassed(score,total) ? 'Pass' : 'Fail'; }
function resultBadgeHtml(score, total){
  const ok = isPassed(score,total);
  return `<span class="badge ${ok?'badge-done':'badge-locked'}">${ok?'Pass':'Fail'}</span>`;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const _fontLoaded = {};
function ensureFont(name){
  if(!name || _fontLoaded[name]) return;
  const f = FONT_LIST.find(x=>x.name===name); if(!f) return;
  _fontLoaded[name] = 1;
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f.name).replace(/%20/g,'+') + (f.spec ? ':'+f.spec : '') + '&display=swap';
  document.head.appendChild(l);
}
function fontStack(name){
  const f = FONT_LIST.find(x=>x.name===name); if(!f) return '';
  const fb = f.kind==='serif' ? "Georgia,'Times New Roman',serif" : (f.kind==='display' ? "Impact,'Arial Narrow',sans-serif" : "var(--font)");
  return `"${f.name}",${fb}`;
}
function hexRgba(hex, a){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '';
  const n = parseInt(m[1],16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function boxTransparency(){
  const v = Number(SITE_SETTINGS.boxTransparency);
  return (Number.isFinite(v) && v>=0) ? Math.min(100, v) : -1;
}
const BAR_META = [
  {key:'header', title:'Header', def:30},
  {key:'footer', title:'Footer', def:0}
];
/* ---- branding: logo, background posters (header / footer / login / whole site), header clock ---- */
const BG_META = [
  {key:'header', title:'Header', hint:'Sits behind the top bar — logo and text stay in front.', blur:0, dim:40},
  {key:'footer', title:'Footer bar', hint:'Long / wide banners work best here.', blur:0, dim:40},
  {key:'site',   title:'Whole site (full screen)', hint:'Behind every page — the admin/guard screens and the login forms. Used on the home page too if no hero-page background is set below.', blur:0, dim:50}
