function exportExamExcel(examId, monthId, typeFilter){
  const isAll = examId===RESULTS_ALL;
  const exList = isAll ? examsForMonth(monthId).filter(e=>!typeFilter || e.examType===typeFilter) : [examById(examId)].filter(Boolean);
  if(exList.length===0){ alert('Please select an exam.'); return; }
  const usedNames = new Set();
  const sheetName = (base)=>{
    let n = String(base||'Exam').replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || 'Exam';
    let out = n, i = 2;
    while(usedNames.has(out.toLowerCase())){ out = n.slice(0,25) + ' ' + (i++); }
    usedNames.add(out.toLowerCase());
    return out;
  };
  const summaryHeader = ['Sr. No.','Date','Time','Name','Gate Pass Number','Post','Mobile','Exam Type','Total Marks','Achieved Marks','Passing Marks','Result'];
  const summaryItems = [];
  const sheets = [];
  exList.forEach(ex=>{
    const attempts = DB.attempts.filter(a=>a.examId===ex.id).sort((a,b)=>a.submittedAt-b.submittedAt);
    if(attempts.length===0) return;
    const qs = questionsForExam(ex.id);
    const header = summaryHeader.slice();
    for(let i=0;i<qs.length;i++) header.push('Q'+(i+1)+' Selected');
    const monthLabelTxt = (monthById(monthId)||{}).label || '';
    const attSetA = new Set(attempts.map(a=>a.guardMobile));
    const topA = buildReportTop((ex.nameEn||'').trim()||(ex.nameHi||'').trim()||examLabel(ex), ex.examType||'-', monthLabelTxt, attSetA.size, header.length, passFailFor(attSetA,[ex]));
    const headerRowIdx = topA.rows.length;
    const rows = topA.rows.concat([header]);
    attempts.forEach(a=>{
      const g = findGuard(a.guardMobile);
      const dt = fmtDateTime(a.submittedAt);
      const base = [dt.date, dt.time, g?g.name:a.guardMobile, g?g.gatePass:'-', g?g.post:'-', a.guardMobile, ex.examType||'-', a.total, a.score, passMarkFor(a.total), resultWord(a.score,a.total)];
      summaryItems.push({t:a.submittedAt, row:base});
      const row = [rows.length - headerRowIdx].concat(base);
      qs.forEach((q,i)=> row.push(a.answers[i]!=null ? letter(a.answers[i]) : ''));
      rows.push(row);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = header.map((h,i)=> i<12 ? {wch: Math.max(16,h.length+2)} : {wch:10});
    styleWorksheetPro(ws, headerRowIdx);
    styleReportTop(ws, topA, header.length);
    sheets.push({ name: isAll ? (ex.examType||ex.nameEn||ex.nameHi||'Exam') : (ex.nameEn||'Exam'), ws });
  });
  if(sheets.length===0){ alert(isAll ? 'There are no attempts for this month yet.' : 'There are no attempts for this exam yet.'); return; }
  const wb = XLSX.utils.book_new();
  if(isAll){
    /* first sheet = month summary (same layout as Month Summary Export, this month only), then one detailed sheet per exam */
    const mrec = DB.months.find(x=>x.id===monthId);
    if(mrec) XLSX.utils.book_append_sheet(wb, buildMonthSummarySheet([mrec], typeFilter||''), sheetName('Month Summary'));
  }
  sheets.forEach(sh=> XLSX.utils.book_append_sheet(wb, sh.ws, sheetName(sh.name)));
  const blob = new Blob([XLSX.write(wb,{bookType:'xlsx', type:'array'})], {type:'application/octet-stream'});
  let filename;
  if(isAll){
    const m = DB.months.find(x=>x.id===monthId);
    filename = ((m&&m.label?m.label:'month').replace(/[^a-z0-9]+/gi,'_')) + '_all_exam_results.xlsx';
  } else {
    filename = (((exList[0].nameEn||'').replace(/[^a-z0-9]+/gi,'_'))||'exam_results') + '_results.xlsx';
  }
  if(window.claude){
    claude.use('downloads').then(dl=>{
      if(!dl){ fallbackDownload(blob, filename); return; }
      dl.save({filename, data: blob}).catch(()=>fallbackDownload(blob, filename));
    }).catch(()=>fallbackDownload(blob, filename));
  } else {
    fallbackDownload(blob, filename);
  }
}

/* Month-wise summary workbook: one sheet, every month, every exam in it, plus a total row per month. */
function buildMonthSummarySheet(months, onlyTypeFilter){
  const header = ['Sr. No.','Month','Exam Type','Exam Name','Registered','Attend','Attend %','Not Attend','Not Attend %','Pass','Pass %','Fail','Fail %'];
  const ncols = header.length;
  const blank = ()=>new Array(ncols).fill('');
  const t0 = blank(); t0[0] = 'Vedanta Limited Chhattisgarh Thermal Power Plant – Security Examination Month-wise Summary';
  const t1 = blank(); t1[0] = 'Generated on: ' + fmtDateTime(Date.now()).date + '   |   Attend % and Not Attend % = of registered   |   Pass % and Fail % = of attend   |   Pass mark: ' + PASS_PERCENT + '%';
  const mk = (n,label,type,name,reg,att,pf)=>{
    reg = Math.max(reg, att);
    const notAtt = Math.max(0, reg-att);
    return [n, label, type, name, reg, att, pctStr(att,reg), notAtt, pctStr(notAtt,reg), pf.pass, pctStr(pf.pass,att), pf.fail, pctStr(pf.fail,att)];
  };
  const body = [], kinds = [];
  let n = 0;
  months.forEach(m=>{
    const exams = examsForMonth(m.id).filter(e=>!onlyTypeFilter || e.examType===onlyTypeFilter);
    const end = (m.year!=null && m.monthNum!=null) ? new Date(m.year, m.monthNum+1, 1).getTime() : Infinity;
    const reg = DB.guards.filter(g=>!g.registeredAt || g.registeredAt<end).length;
    if(exams.length===0){ body.push(mk('', m.label, '-', 'No exam added', reg, 0, {pass:0,fail:0})); kinds.push('total'); return; }
    exams.forEach(ex=>{
      const set = new Set(DB.attempts.filter(a=>a.examId===ex.id).map(a=>a.guardMobile));
      body.push(mk(++n, m.label, ex.examType||'-', (ex.nameEn||'').trim()||(ex.nameHi||'').trim()||examLabel(ex), reg, set.size, passFailFor(set,[ex])));
      kinds.push('exam');
    });
    const allSet = new Set(DB.guards.filter(g=>exams.every(ex=>DB.attempts.some(a=>a.guardMobile===g.mobile && a.examId===ex.id))).map(g=>g.mobile));
    body.push(mk('', m.label, 'Month total', 'Attempted all ' + exams.length + ' exam' + (exams.length===1?'':'s'), reg, allSet.size, passFailFor(allSet,exams)));
    kinds.push('total');
  });
  const rows = [t0, t1, blank(), header].concat(body);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [8,18,16,36,12,10,12,12,14,8,10,8,10].map(w=>({wch:w}));
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:ncols-1}}, {s:{r:1,c:0},e:{r:1,c:ncols-1}}];
  ws['!rows'] = []; ws['!rows'][0] = {hpt:30}; ws['!rows'][1] = {hpt:21}; ws['!rows'][3] = {hpt:24};
  const thin = {style:'thin', color:{rgb:'B7C6D9'}}, border = {top:thin,bottom:thin,left:thin,right:thin};
  const put = (r,c,st)=>{ const a = XLSX.utils.encode_cell({r,c}); if(!ws[a]) ws[a] = {t:'s', v:''}; ws[a].s = st; };
  for(let c=0;c<ncols;c++){
    put(0,c,{font:{bold:true,sz:15,color:{rgb:'FFFFFF'}}, fill:{patternType:'solid',fgColor:{rgb:'1F4E78'}}, alignment:{vertical:'center',horizontal:'center'}});
    put(1,c,{font:{bold:true,sz:11,color:{rgb:'1F4E78'}}, fill:{patternType:'solid',fgColor:{rgb:'DDEBF7'}}, alignment:{vertical:'center',horizontal:'center'}});
    put(3,c,{font:{bold:true,sz:11,color:{rgb:'FFFFFF'}}, fill:{patternType:'solid',fgColor:{rgb:'1F4E78'}}, alignment:{vertical:'center',horizontal:'center'}, border});
  }
  kinds.forEach((k,i)=>{
    const r = 4+i, tot = k==='total';
    for(let c=0;c<ncols;c++) put(r,c,{
      font: tot ? {bold:true,sz:10.5,color:{rgb:'1F4E78'}} : {sz:10.5,color:{rgb:'222222'}},
      fill: {patternType:'solid',fgColor:{rgb: tot ? 'DDEBF7' : 'FFFFFF'}},
      alignment: {vertical:'center', horizontal: (c===1||c===2||c===3) ? 'left' : 'center'}, border
    });
  });
  ws['!freeze'] = { xSplit:0, ySplit:4, topLeftCell:'A5', activePane:'bottomLeft', state:'frozen' };
  return ws;
}
function exportMonthSummaryExcel(){
  const months = monthsSorted();

function fallbackDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function adminDeleteGuard(mobile, el, onDone){
        const g = findGuard(mobile);
    const attCount = allAttemptsForGuard(mobile).length;
    const resultsLine = attCount>0
      ? `\n\nAll ${attCount} exam result${attCount===1?'':'s'} of this person will also be deleted automatically — you do not need to delete them one by one.`
      : '';
    if(!confirm(`Permanently delete ${g?g.name:mobile} (${mobile}) from registered security persons?${resultsLine}\n\nThis cannot be undone. They will need to register again (name, gate pass, new PIN) before they can log in or take any exam.`)) return;
    if(el) el.disabled = true;
    try{
      /* 1) remove every exam result (attempt) of this person in one go */
      const rAtt = await adminDb('attempts','delete', null, {guard_mobile: mobile});
      if(rAtt.error) throw rAtt.error;
      if(attCount>0 && (!rAtt.data || rAtt.data.length===0)){
        throw { message:'The database did not delete this person\'s exam results (0 rows affected). This almost always means a Row Level Security (RLS) policy on the "attempts" table is blocking the delete — nothing was removed.' };
      }
      DB.attempts = DB.attempts.filter(a=>a.guardMobile!==mobile);
      /* 2) remove the security person */
      const rG = await dbWriteAdmin('guards','delete', null, {mobile}, 'guards');
      if(!rG.ok){
        patch({});
        console.error(rG.error);
        alert('Their exam results were deleted, but the security person could not be removed.\n\n'+(rG.error&&rG.error.message?rG.error.message:'Please try again.'));
        return;
      }
      DB.guards = DB.guards.filter(x=>x.mobile!==mobile);
      showConfirmToast('Security person and all their results deleted', 'danger');
      if(onDone) onDone(); else patch({});
    }catch(error){
      console.error(error);
      alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.'));
      if(el) el.disabled = false;
    }
}

    const ranking = guardRanking();
    header = ['Rank','Name','Gate Pass Number','Mobile','Post','Registered On','Achieved Marks','Total Marks','Passing Marks','Percentage','Result'];
    dataRows = ranking.map((r,i)=>[i+1, r.g.name, r.g.gatePass, r.g.mobile, r.g.post, fmtRegAt(r.g.registeredAt), r.achievedMarks, r.totalMarks, r.totalMarks>0?passMarkFor(r.totalMarks):'-', r.pct.toFixed(1)+'%', r.totalMarks>0?resultWord(r.achievedMarks,r.totalMarks):'-']);
    title = 'Registered Security personnel';
  } else if(view==='pass' || view==='fail'){
    header = ['Rank','Name','Gate Pass Number','Mobile','Post','Achieved Marks','Total Marks','Passing Marks','Percentage','Result'];
    dataRows = masterDataPassFail()[view].map((r,i)=>[i+1, r.g.name, r.g.gatePass, r.g.mobile, r.g.post, r.achievedMarks, r.totalMarks, r.totalMarks>0?passMarkFor(r.totalMarks):'-', r.pct.toFixed(1)+'%', r.totalMarks>0?resultWord(r.achievedMarks,r.totalMarks):'-']);
    title = view==='pass' ? 'Pass' : 'Fail';
  } else {
    const { attend, notAttend } = masterDataAttendance();
    const list = view==='attend' ? attend : notAttend;
    if(view==='notattend'){
      const examsToCheck = masterDataExamsToCheck().examsToCheck;
      header = ['S.No.','Name','Gate Pass Number','Mobile','Post','Missed Exams'];
      dataRows = list.map((g,i)=>[i+1, g.name, g.gatePass, g.mobile, g.post, missedExamTypesFor(g.mobile, examsToCheck).join(', ') || '-']);
    } else {
      header = ['S.No.','Name','Gate Pass Number','Mobile','Post'];
      dataRows = list.map((g,i)=>[i+1, g.name, g.gatePass, g.mobile, g.post]);
    }
    title = view==='attend' ? 'Attend' : 'Not Attend';
  }
  if(dataRows.length===0){ alert('There is no data to export.'); return; }
  const rows = [header, ...dataRows];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = header.map(h=>({wch: Math.max(14,h.length+2)}));
  styleWorksheetPro(ws);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, title.slice(0,28));
  const blob = new Blob([XLSX.write(wb,{bookType:'xlsx', type:'array'})], {type:'application/octet-stream'});
  const filename = title.replace(/[^a-z0-9]+/gi,'_') + '_masterdata.xlsx';
  if(window.claude){
    claude.use('downloads').then(dl=>{
      if(!dl){ fallbackDownload(blob, filename); return; }
      dl.save({filename, data: blob}).catch(()=>fallbackDownload(blob, filename));
    }).catch(()=>fallbackDownload(blob, filename));
  } else {
    fallbackDownload(blob, filename);
  }
}

/* ---- live sync -------------------------------------------------------
   Root cause behind "sometimes it shows, sometimes it doesn't": DB was
   only ever fetched once, at first page load. Any change made from a
   different tab, browser or device (a new guard registering, an admin
   locking a month, a result being deleted) was invisible to everyone
   else until they did a full manual page reload.

   This keeps every screen live using two mechanisms:
   1. Supabase Realtime (a live Postgres change feed) for months, exams,
      questions and attempts — the moment any device writes a row, every
      other open tab/device is notified in well under a second and
      quietly refetches just that table.
   2. A fast 2-second poll of `guards_public` for registered security
      persons. Realtime can only watch actual tables, not views — and
      `guards_public` is deliberately a view (not the raw `guards`
      table) so that a guard's PIN hash never has to reach the browser.
      2 seconds reads as instant to a person, without ever putting PIN
      data on a live broadcast channel.

   Either way, a repaint only happens on screens where it cannot wipe
   out something the person is mid-way through typing (an open question
   editor, an in-progress exam, an unsaved PIN-reset form, etc are left
   untouched — they simply pick up the fresh data next time the person
   navigates there). A slow 30-second full refetch runs underneath both
   as a safety net in case the realtime connection ever drops silently
   (e.g. a flaky mobile network). ----------------------------------- */
function isSafeToRepaint(){
  if(['guard-dashboard','guard-month','guard-myexams'].includes(S.screen)) return true;
  if(S.screen==='admin-dashboard'){
    const tab = S.adminTab||'dashboard';
    if(tab==='guardprofile') return !S.showResetPin && !S.showEditGuard; // don't wipe an in-progress PIN reset
    if(!['dashboard','months','masterdata','results'].includes(tab)) return false; // exam/question editor has its own draft state
    if(S.adminMonthId || S.adminExamId) return false; // inside a month/exam drill-down with its own add-form
    return true;
  }
  return false;
}
const REFRESH_TIMERS = {};
const TABLE_REFETCH = {
  months:   async ()=>{ const rows=await fetchAllRows(()=>sb.from('months').select('*'),'id'); DB.months=rows.map(toCamel); },
  exams:    async ()=>{ const rows=await fetchAllRows(()=>sb.from('exams').select('*'),'id'); DB.exams=rows.map(toCamel); },
  questions:async ()=>{ const rows=await fetchAllRows(()=>sb.from('questions').select('*'),'id'); DB.questions=rows.map(toCamel); await mergeAdminKeys(); },
  attempts: async ()=>{ const rows=await fetchAllRows(()=>sb.from('attempts').select('*'),'id'); DB.attempts=rows.map(toCamel); },
};
function scheduleTableRefresh(table){
  // debounce: a burst of changes to the same table (e.g. "publish all
  // drafts" touching many questions at once) triggers only one refetch
  clearTimeout(REFRESH_TIMERS[table]);
  REFRESH_TIMERS[table] = setTimeout(async ()=>{
    try{ await TABLE_REFETCH[table](); if(isSafeToRepaint()) render(); }
    catch(err){ console.error('live sync refresh failed for', table, err); }
  }, 1500);
}
async function refreshMonthsFast(){
  try{ await TABLE_REFETCH.months(); if(isSafeToRepaint()) render(); }
  catch(err){ console.error('months refresh failed', err); }
}
async function refreshExamsFast(){
  try{ await TABLE_REFETCH.exams(); if(isSafeToRepaint()) render(); }
  catch(err){ console.error('exams refresh failed', err); }
}
async function refreshGuardsFast(){
  try{
    const rows = await fetchAllRows(()=>sb.from('guards_public').select('*'),'mobile');
    DB.guards = rows.map(guardRowToObj);
    if(isSafeToRepaint()) render();
  }catch(err){ console.error('guard refresh failed', err); }
}
let LAST_GUARD_COUNT = null;
async function checkGuardsChanged(){
  /* head+count request: almost zero egress. Poori list tabhi laate hain jab count badla ho. */
  try{
    const { count, error } = await sb.from('guards_public').select('mobile',{count:'exact',head:true});
    if(error) throw error;
    if(count!==LAST_GUARD_COUNT){ LAST_GUARD_COUNT = count; await refreshGuardsFast(); }
  }catch(err){ console.error('guard count check failed', err); }
}
/* attempts: realtime se aayi row seedhe merge (poori table dobara download nahi) */
function applyAttemptChange(p){
  try{
    if(p.eventType==='DELETE'){
      const id = p.old && p.old.id;
      if(!id) return scheduleTableRefresh('attempts');
      DB.attempts = DB.attempts.filter(a=>a.id!==id);
    } else if(p.new && p.new.id){
      const row = toCamel(p.new); const i = DB.attempts.findIndex(a=>a.id===row.id);
      if(i>=0) DB.attempts[i] = row; else DB.attempts.push(row);
    } else return scheduleTableRefresh('attempts');
    clearTimeout(REFRESH_TIMERS.attemptsRender);
    REFRESH_TIMERS.attemptsRender = setTimeout(()=>{ if(isSafeToRepaint()) render(); }, 400);
  }catch(err){ scheduleTableRefresh('attempts'); }
}
let FULL_REFRESH_IN_FLIGHT = false;
async function refreshEverything(){
  if(FULL_REFRESH_IN_FLIGHT) return;
  FULL_REFRESH_IN_FLIGHT = true;
  try{ await loadAllData(); if(isSafeToRepaint()) render(); }
  catch(err){ console.error('full refresh failed', err); }
  finally{ FULL_REFRESH_IN_FLIGHT = false; }
}
/* ---- live sync, scaled for many concurrent security persons ---------
   Realtime connections and the "guards" poll are kept ADMIN-ONLY. With
   50-100 guards potentially logged in at once, giving every single one
   of them a Realtime channel would (a) eat most of the free tier's
   200-connection budget just sitting idle, and (b) mean that every
   single exam submission broadcasts a "table changed" event to every
   other guard's browser too, each of whom would then needlessly refetch
   the whole attempts table — multiplying load exactly when it matters
   least (everyone mid-exam) and most when many people submit close
   together. None of that data (other guards' registrations, other
   guards' attempts, exam edits) is ever shown on a guard's own screen
   anyway, so guards simply don't need it pushed to them.
   Guards instead get a cheap, plain poll of just the small `months`
   table (a handful of rows — this is what drives the lock/unlock
   indicator) every few seconds, which reads as live to a person without
   ever opening a Realtime socket or refetching the larger tables. A
   slower full refresh underneath covers everyone as a safety net, so a
   guard still sees a newly-published exam or a fixed question within
   under a minute even without realtime. ----------------------------- */
let ADMIN_CHANNEL = null;
function syncAdminChannel(){
  const isAdmin = SESSION && SESSION.role==='admin';
  if(isAdmin && !ADMIN_CHANNEL){
    ADMIN_CHANNEL = sb.channel('vses-live-admin');
    Object.keys(TABLE_REFETCH).forEach(table=>{
      if(table==='attempts') ADMIN_CHANNEL.on('postgres_changes', {event:'*', schema:'public', table}, applyAttemptChange);
      else ADMIN_CHANNEL.on('postgres_changes', {event:'*', schema:'public', table}, ()=>scheduleTableRefresh(table));
    });
    ADMIN_CHANNEL.subscribe();
  } else if(!isAdmin && ADMIN_CHANNEL){
    sb.removeChannel(ADMIN_CHANNEL);
    ADMIN_CHANNEL = null;
  }
}
let LAST_FULL_REFRESH = Date.now();
function maybeFullRefresh(minAgeMs){
  if(document.hidden) return;
  if(Date.now()-LAST_FULL_REFRESH < minAgeMs) return;
  if(SESSION && SESSION.role==='guard' && S && S.screen==='guard-exam-run') return; // exam ke dauran koi refresh nahi
  LAST_FULL_REFRESH = Date.now();
  refreshEverything();
}
function startLiveSync(){
  syncAdminChannel();
  LAST_GUARD_COUNT = DB.guards.length;
  let tick = 0;
  setInterval(()=>{
    if(document.hidden) return; // tab background mein ho to polling nahi
    tick++;
    syncAdminChannel();
    const isAdm = SESSION && SESSION.role==='admin';
    if(isAdm){ if(tick%3===0) checkGuardsChanged(); }          // ~15 sec, head-count only
    else if(!(S && S.screen==='guard-exam-run') && tick%3===0){ // ~15 sec, chhoti tables, exam ke dauran band
      refreshMonthsFast();
      if(S && S.screen==='guard-month') refreshExamsFast();
    }
  }, 5000);
  // safety-net full refresh: admin 10 min, guard 5 min (guard ke liye ye sirf months+exams+apne attempts hai)
  setInterval(()=>{ maybeFullRefresh((SESSION && SESSION.role==='admin') ? 10*60*1000 : 5*60*1000); }, 60000);
  const onBack = ()=>{ maybeFullRefresh((SESSION && SESSION.role==='admin') ? 5*60*1000 : 3*60*1000); };
  document.addEventListener('visibilitychange', onBack);
  window.addEventListener('focus', onBack);
}
</script>
