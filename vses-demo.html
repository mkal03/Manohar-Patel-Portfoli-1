/* the home (hero) page's own background lives in the Hero page tab, not Look & feel, so it can be
   set up alongside the hero page's text/fonts/colours */
const HERO_BG_META = {key:'hero', title:'Hero page background', hint:'Shown full-screen behind the home page only.', blur:0, dim:35};
function capKey(k){ return k.charAt(0).toUpperCase()+k.slice(1); }
function bgCfg(key){
  const P = capKey(key), m = BG_META.find(x=>x.key===key) || HERO_BG_META;
  const n = (v,d)=>{ const x = Number(v); return (v===null||v===undefined||v==='') || !Number.isFinite(x) ? d : x; };
  return {
    url: SITE_SETTINGS['bg'+P] || '',
    type: SITE_SETTINGS['bg'+P+'Type']==='video' ? 'video' : 'image',
    blur: Math.max(0, Math.min(40, n(SITE_SETTINGS['bg'+P+'Blur'], m.blur))),
    dim: Math.max(0, Math.min(100, n(SITE_SETTINGS['bg'+P+'Dim'], m.dim)))
  };
}
const _brandCache = {};
function setRootVar(name, val){
  if(_brandCache[name]===val) return;
  _brandCache[name] = val;
  if(val===''||val==null) document.documentElement.style.removeProperty(name);
  else document.documentElement.style.setProperty(name, val);
}
/* Pushes logo / background settings into CSS variables (cheap — only changed values are written),
   picks which full-screen image is active, and keeps the browser-tab icon in sync with the logo. */
function applyBrandingCore(){
  const logo = SITE_SETTINGS.logoImg || '';
  setRootVar('--logo-img', logo ? `url("${logo}")` : 'none');
  BG_META.forEach(m=>{
    const c = bgCfg(m.key);
    setRootVar('--bgb-'+m.key, c.blur+'px');
    setRootVar('--bgd-'+m.key, String(c.dim/100));
  });
  BAR_META.forEach(b=>{
    const t = barTransparency(b.key), short = b.key==='header' ? 'hdr' : 'ftr';
    setRootVar('--'+short+'-op', String((100-t)/100));
    if(b.key==='header') setRootVar('--hdr-bf', t>=100 ? 'none' : 'blur(14px) saturate(140%)'); // fully clear header = no frosting either
  });
  if(_brandCache.fav!==logo){
    _brandCache.fav = logo;
    let ico = document.querySelector('link[rel="icon"][data-vses]');
    if(logo){
      if(!ico){ ico = document.createElement('link'); ico.rel = 'icon'; ico.setAttribute('data-vses','1'); document.head.appendChild(ico); }
      ico.type = 'image/png'; ico.href = logo;
    } else if(ico){ ico.remove(); }
  }
}
/* ---- background media: header / footer / login / whole-site — image OR a looping video.
   Kept as real <img>/<video> DOM nodes that PERSIST across re-renders (moved into place,
   never recreated unless the actual media changed) so a background video doesn't restart
   every time the admin clicks around the site — render() calls syncBgMedia() after every
   screen update instead of embedding the media inline in the regenerated HTML. ---- */
const _bgNode = {}, _bgSig = {};
function bgMediaNode(cfg){
  const isVideo = cfg.type==='video';
  const el = document.createElement(isVideo ? 'video' : 'div');
  el.className = 'bg-img';
  if(isVideo){
    el.src = cfg.url; el.muted = true; el.autoplay = true; el.loop = true; el.playsInline = true;
    el.setAttribute('playsinline',''); el.setAttribute('preload','auto');
  } else {
    el.style.backgroundImage = `url("${cfg.url}")`;
  }
  return el;
}
function mountBg(key, container){
  if(!container) return;
  const cfg = bgCfg(key);
  if(!cfg.url){
    Array.from(container.children).forEach(ch=>ch.remove());
    _bgSig[key] = '';
    return;
  }
  const sig = cfg.type+'|'+cfg.url.length+'|'+cfg.url.slice(-32);
  if(_bgSig[key]!==sig || !_bgNode[key]){
    if(_bgNode[key]) _bgNode[key].remove();
    _bgNode[key] = bgMediaNode(cfg);
    _bgSig[key] = sig;
  }
  Array.from(container.children).forEach(ch=>{ if(ch!==_bgNode[key] && !ch.classList.contains('bg-dim')) ch.remove(); });
  if(_bgNode[key].parentElement !== container) container.appendChild(_bgNode[key]);
  if(!container.querySelector('.bg-dim')){ const dim = document.createElement('div'); dim.className = 'bg-dim'; container.appendChild(dim); }
}
/* called after every render() — finds the header/footer/full-page background containers
   in the freshly-drawn DOM and mounts (or reuses) the right media node in each */
/* Keeps every looping background/box video actually playing. A <video> pauses whenever it is
   removed from the document (which happens for an instant on every re-render since we replace
   innerHTML) and browsers do not auto-resume it — so without this, a background video looks like
   it "randomly stops". Runs after every render() and self-heals on 'pause'/'stalled' too. */
function ensureVideosPlay(){
  document.querySelectorAll('video[autoplay]').forEach(v=>{
    v.muted = true;
    if(v.paused) v.play().catch(()=>{});
    if(!v.dataset.selfHeal){
      v.dataset.selfHeal = '1';
      v.addEventListener('pause', ()=>{ if(!document.hidden) v.play().catch(()=>{}); });
      v.addEventListener('stalled', ()=> v.play().catch(()=>{}));
    }
  });
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) ensureVideosPlay(); });
function syncBgMedia(){
  mountBg('header', document.querySelector('.bar-media[data-media="header"]'));
  mountBg('footer', document.querySelector('.bar-media[data-media="footer"]'));
  const pageKey = (S.screen==='home' && bgCfg('hero').url) ? 'hero' : (bgCfg('site').url ? 'site' : '');
  let el = document.getElementById('pageBg');
  if(!el){ el = document.createElement('div'); el.id = 'pageBg'; el.setAttribute('aria-hidden','true'); document.body.insertBefore(el, document.body.firstChild); }
  el.setAttribute('data-key', pageKey);
  document.documentElement.classList.toggle('has-page-bg', !!pageKey);
  if(pageKey) mountBg(pageKey, el); else Array.from(el.children).forEach(ch=>ch.remove());
}

/* Reads an image the admin picked and shrinks it so it stays light for everyone who opens the site.
   circle:true  -> square centre-crop with round transparent edges (PNG) — used for the logo
   otherwise    -> scaled down to maxW x maxH, saved as JPEG — used for posters */
function fileToDataUrl(file, opt){
  return new Promise((resolve, reject)=>{
    if(opt && opt.video){
      if(!file || !/^video\//.test(file.type||'')){ reject(new Error('Please choose a video file (MP4 or WebM).')); return; }
      if(file.size > 15*1024*1024){ reject(new Error('This video is larger than 15 MB. Please trim it or compress it first — large videos are slow to load for guards on mobile data.')); return; }
      const vfr = new FileReader();
      vfr.onerror = ()=>reject(new Error('This file could not be read.'));
      vfr.onload = ()=>resolve(vfr.result);
      vfr.readAsDataURL(file);
      return;
    }
    if(!file || !/^image\//.test(file.type||'')){ reject(new Error('Please choose an image file (PNG, JPG or WebP).')); return; }
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('This file could not be read.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('This image could not be opened. Please try a PNG or JPG.'));
      img.onload = ()=>{
        try{
          let sw = img.naturalWidth || 512, sh = img.naturalHeight || 512;
          const c = document.createElement('canvas'); const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          if(opt.circle){
            const side = Math.min(sw, sh), sx = (sw-side)/2, sy = (sh-side)/2, size = Math.min(opt.size, side);
            c.width = c.height = size;
            ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.closePath(); ctx.clip();
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(c.toDataURL('image/png'));
          } else {
            const r = Math.min(1, opt.maxW/sw, opt.maxH/sh);
            c.width = Math.max(1, Math.round(sw*r)); c.height = Math.max(1, Math.round(sh*r));
            ctx.fillStyle = '#0A0F1C'; ctx.fillRect(0,0,c.width,c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', opt.quality||0.78));
          }
        }catch(e){ reject(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ---- Storage-backed uploads for header/footer/hero/site backgrounds and hero-box media ----
   These used to be saved as base64 text directly in the settings row. That silently broke for
   anything but small files: a video easily blew past both the browser's DEMO_LS quota and
   Supabase's request-size limit, so the save failed quietly and the video vanished on refresh.
   Uploading the actual file to Supabase Storage and saving only its (short) URL fixes both. */
const STORAGE_BUCKET = 'site-media';
function canvasResizeToBlob(file, opt){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type||'')){ reject(new Error('Please choose an image file (PNG, JPG or WebP).')); return; }
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('This file could not be read.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('This image could not be opened. Please try a PNG or JPG.'));
      img.onload = ()=>{
        try{
          let sw = img.naturalWidth || 512, sh = img.naturalHeight || 512;
          const c = document.createElement('canvas'); const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          const r = Math.min(1, opt.maxW/sw, opt.maxH/sh);
          c.width = Math.max(1, Math.round(sw*r)); c.height = Math.max(1, Math.round(sh*r));
          ctx.fillStyle = '#0A0F1C'; ctx.fillRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(blob=>{ blob ? resolve(blob) : reject(new Error('This image could not be processed.')); }, 'image/jpeg', opt.quality||0.8);
        }catch(e){ reject(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function uploadToStorage(fileOrBlob, keyHint, ext){
  const path = `${keyHint}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, fileOrBlob, {
    upsert: false, contentType: fileOrBlob.type || undefined, cacheControl: '31536000'
  });
  if(upErr){
    const raw = upErr.message || '';
    throw new Error(/bucket not found/i.test(raw)
      ? 'Storage isn\'t set up yet for this site. Please run the storage setup SQL (see "For your developer" below), then try again.'
      : (raw || 'Upload failed. Please try again.'));
  }
  const { data: pub } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return pub.publicUrl;
}
async function uploadImageToStorage(file, keyHint, opt){
  const blob = await canvasResizeToBlob(file, opt);
  return uploadToStorage(blob, keyHint, 'jpg');
}
async function uploadVideoToStorage(file, keyHint){
  if(!file || !/^video\//.test(file.type||'')) throw new Error('Please choose a video file (MP4 or WebM).');
  if(file.size > 20*1024*1024) throw new Error('This video is larger than 20 MB. Please trim it or compress it first — smaller clips load faster for guards on mobile data.');
  const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'') : '';
  return uploadToStorage(file, keyHint, ext || 'mp4');
}
/* ---- cleans up the file a background/hero image or video is REPLACING (or being reset away
   from), so old uploads don't keep silently piling up in Supabase Storage. Only ever deletes
   something that actually lives in our own bucket (never an unrelated external URL), and only
   once the new file has been saved successfully — so a failed upload never loses the old one. */
function storagePathFromUrl(url){
  if(!url) return null;
  const marker = `/storage/v1/object/public/${STORAGE_BUCKET}/`;
  const i = url.indexOf(marker);
  if(i===-1) return null;
  return decodeURIComponent(url.slice(i+marker.length).split('?')[0]);
}
async function deleteOldStorageFile(oldUrl, newUrl){
  if(!oldUrl || oldUrl===newUrl) return;
  const path = storagePathFromUrl(oldUrl);
  if(!path) return;
  try{ await sb.storage.from(STORAGE_BUCKET).remove([path]); }
  catch(err){ console.error('old media cleanup failed', err); } // cleanup is best-effort; never block the UI on it
}
const SITE_SETTINGS_LS_KEY = 'vses_site_settings';
async function loadSiteSettings(){
  try{
    const cached = DEMO_LS.getItem(SITE_SETTINGS_LS_KEY);
    if(cached) Object.assign(SITE_SETTINGS, JSON.parse(cached));
  }catch(e){ /* ignore */ }
  applyTheme(); // apply the cached theme immediately so there's no flash before the network call below resolves
  try{
    const { data, error } = await sb.from('settings').select('*').eq('id','site').maybeSingle();
    if(!error && data){
      const row = toCamel(data);
      Object.keys(row).forEach(k=>{ if(row[k]===null || row[k]===undefined) delete row[k]; }); // columns never filled in keep their defaults / local copy
      if(row.footerEnabled!=null) row.footerEnabled = !!row.footerEnabled;
      if(row.showClock!=null) row.showClock = !!row.showClock;
      if(row.sidebarAlwaysOpen!=null) row.sidebarAlwaysOpen = !!row.sidebarAlwaysOpen;
      if(row.headerBorder!=null) row.headerBorder = !!row.headerBorder;
      if(row.footerBorder!=null) row.footerBorder = !!row.footerBorder;
      if(typeof row.heroBoxes === 'string'){
        try{ const parsed = JSON.parse(row.heroBoxes); row.heroBoxes = Array.isArray(parsed) ? parsed : []; }
        catch(e){ row.heroBoxes = []; }
      }
      // one-time migration: the old single "login & home page" background is now just the
      // home page's own background (the site background covers login forms instead)
      if(!row.bgHero && data.bg_login){
        row.bgHero = data.bg_login; row.bgHeroType = data.bg_login_type || 'image';
        row.bgHeroBlur = data.bg_login_blur; row.bgHeroDim = data.bg_login_dim;
      }
      Object.assign(SITE_SETTINGS, row);
    }
  }catch(e){ /* settings table not created yet — defaults/local cache are used */ }
  applyTheme();
  applyBranding();
}

/* ---- navigation history, driving the phone/browser's own physical back
   button/gesture only — there is no on-screen Back button anywhere in this
   app anymore. Every in-app navigation pushes one browser history entry
   (history.pushState); a single popstate listener below does the work of
   restoring the previous screen, confirming before an in-progress exam is
   discarded, and confirming + logging the person out when back is pressed
   with nothing left inside the app to go back to. ------------------------ */
let HISTORY = [];
function go(screen, extra){
  if(S && S.screen) HISTORY.push(S);
  S = Object.assign({screen}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
function patch(extra){ S = Object.assign({}, S, extra); render(); }
/* Switching between top-level sections (Master Data / Months & Exams /
   Results) is NOT a drill-down, so it must not stack up back-history like an
   undo/redo list. Each section is a fresh "root": HISTORY is cleared, any
   open sub-view (month detail, exam editor, guard profile, master-data box)
   is dropped, and the browser entry is replaced (not added). Pressing back
   on a section's home page therefore has nothing left to step back to and
   shows the logout confirmation, while drilling deeper from that section
   (goPush) still steps back one level at a time. */
function goRoot(extra){
  HISTORY = [];
  S = Object.assign({screen:'admin-dashboard'}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.replaceState({vsesNav:true}, ''); }catch(e){}
  render();
}
/* like go(), but stays on the same top-level screen while drilling into a
   sub-view (e.g. admin: months -> month detail -> question editor). Pushes
   the current state onto HISTORY so the physical/device back button steps back one
   sub-view at a time instead of jumping straight out to the login page. */
function goPush(extra){
  HISTORY.push(S);
  S = Object.assign({}, S, extra);
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
/* Used right after a successful login/registration. Unlike go(), this does
   NOT push the login/auth screen onto HISTORY — the dashboard the person
   lands on becomes the app's fresh "root" screen, with nothing behind it.
   That way one back-button press from here means "there is nothing left
   inside the app", which is exactly when the exit-confirmation + auto
   logout in the popstate listener below should kick in — instead of
   quietly showing the login form again while the session is still active. */
function enterApp(screen, extra){
  HISTORY = [];
  S = Object.assign({screen}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
/* Used when leaving the exam RESULT screen (Back to month / View your
   answers). The just-finished, now-locked exam-run screen (and this result
   screen itself, which is never pushed to HISTORY at all) must never be
   reachable again via the physical/browser back button. So this drops only
   that spent exam-run entry — and, when returning straight to the month's
   exam list, the now-duplicate copy of that same list already sitting
   underneath it — while leaving everything further back (the month list
   itself, the months dashboard) exactly as reachable as it always was. */
function leaveExamResult(screen, extra){
  while(HISTORY.length && HISTORY[HISTORY.length-1].screen==='guard-exam-run'){
    HISTORY.pop();
  }
  if(screen==='guard-month' && HISTORY.length && HISTORY[HISTORY.length-1].screen==='guard-month'){
    HISTORY.pop();
  }
  S = Object.assign({screen}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.replaceState({vsesNav:true}, ''); }catch(e){}
  render();
}
window.addEventListener('popstate', ()=>{
  if(S && S.screen==='guard-exam-run' && !S.submitted){
    // Never let a stray back-button press quietly throw away an in-progress
    // exam and its answers — confirm first, and if the person cancels,
    // push the browser back to where it was so they stay on the exam.
    const leave = confirm('Are you sure you want to leave? Your exam progress and answers will be lost.');
    if(!leave){ try{ history.pushState({vsesNav:true}, ''); }catch(e){} return; }
  }
  if(HISTORY.length===0 && SESSION){
    // Nothing left inside the app to step back to — this is the screen
    // reached right after login (select-month for a guard, the dashboard
    // for an admin). A native app asks before exiting instead of silently
    // dropping the session, so do the same here: confirm, and only on
    // "OK" log the person out and land on the login screen. On "Cancel",
    // push the browser forward again so they stay exactly where they were.
    const exit = confirm('Are you sure you want to exit? You will be logged out.');
    if(!exit){ try{ history.pushState({vsesNav:true}, ''); }catch(e){} return; }
    clearSession();
    enterApp('home');
    return;
  }
  if(S && S.adminTab==='exam') resetQB();
  if(HISTORY.length>0){
    let next = HISTORY.pop();
    // A 'guard-exam-run' entry only ever ends up in HISTORY already
    // submitted and locked (it's pushed at the moment of submitting) — so
    // if a stray back press (without using the on-screen result buttons)
    // lands on one, skip straight past it to whatever is behind it.
    while(next && next.screen==='guard-exam-run' && HISTORY.length>0){
      next = HISTORY.pop();
    }
    S = next;
    window.scrollTo({top:0,behavior:'instant'});
    render();
  }
  // if HISTORY is already empty (and no session is active) there is nothing
  // left inside the app to go back to, so the browser is simply allowed to
  // leave the page as it normally would — exactly like pressing back on any
  // other website.
});

function findGuard(mobile){ return DB.guards.find(g=>g.mobile===mobile); }
function findAdmin(mobile){ return DB.admins.find(a=>a.mobile===mobile); }
function monthsSorted(){
  return DB.months.slice().sort((a,b)=>{
    const ay = a.year!=null?a.year:9999, am = a.monthNum!=null?a.monthNum:0;
    const by = b.year!=null?b.year:9999, bm = b.monthNum!=null?b.monthNum:0;
    if(ay!==by) return ay-by;
    if(am!==bm) return am-bm;
    return a.createdAt-b.createdAt;
  });
}
function examsForMonth(monthId){ return DB.exams.filter(e=>e.monthId===monthId).sort((a,b)=>a.createdAt-b.createdAt); }
function questionsForExam(examId){ return DB.questions.filter(q=>q.examId===examId).sort((a,b)=>a.order-b.order); }
/* Security-person side must only ever see questions the admin has explicitly
   marked "Done" (published). Questions created before this feature existed
   have no `published` field stored — default those to visible so nothing
   that was already live to guards suddenly disappears. */
function isQPublished(q){ return q.published!==undefined ? !!q.published : true; }
function publishedQuestionsForExam(examId){ return questionsForExam(examId).filter(isQPublished); }
function attemptsFor(guardMobile, examId){ return DB.attempts.filter(a=>a.guardMobile===guardMobile && a.examId===examId).sort((a,b)=>b.submittedAt-a.submittedAt); }
function latestAttempt(guardMobile, examId){ const l = attemptsFor(guardMobile, examId); return l[0]||null; }
function allAttemptsForGuard(mobile){ return DB.attempts.filter(a=>a.guardMobile===mobile).sort((a,b)=>b.submittedAt-a.submittedAt); }
function examById(id){ return DB.exams.find(e=>e.id===id); }
function monthById(id){ return DB.months.find(m=>m.id===id); }
/* Ranks every registered guard by their all-time percentage across every exam
   they have attempted at least once (latest attempt per exam is used, so a
   retake doesn't get double-counted). Highest percentage first. */
function guardRanking(){
  return DB.guards.map(g=>{
    const atts = allAttemptsForGuard(g.mobile);
    const examIds = [...new Set(atts.map(a=>a.examId))];
    let totalMarks=0, achievedMarks=0;
    examIds.forEach(exId=>{
      const la = latestAttempt(g.mobile, exId);
      if(la){ totalMarks += la.total; achievedMarks += la.score; }
    });
    const pct = totalMarks>0 ? (achievedMarks/totalMarks*100) : 0;
    return { g, totalMarks, achievedMarks, pct, examsAttempted: examIds.length };
  }).sort((a,b)=> b.pct-a.pct || b.examsAttempted-a.examsAttempted);
}
/* For a given month record, which of its exams are "in scope" given the
   Exam-type filter — either all exams of the month, or just the one type. */
function masterDataExamsToCheck(){
  const monthsAll = monthsSorted();
  const selMonthRec = monthsAll.find(m=>m.monthNum===S.mdMonthNum && m.year===S.mdYear) || null;
  const examsInMonth = selMonthRec ? examsForMonth(selMonthRec.id) : [];
  const examsToCheck = S.mdExamType ? examsInMonth.filter(e=>e.examType===S.mdExamType) : examsInMonth;
  return { selMonthRec, examsInMonth, examsToCheck };
}
/* A guard counts as "Attend" only if they attempted every exam currently in
   scope (per masterDataExamsToCheck); missing even one puts them in "Not Attend". */
function masterDataAttendance(){
  const { examsToCheck } = masterDataExamsToCheck();
  const attend = [], notAttend = [];
  DB.guards.forEach(g=>{
    const attemptedAll = examsToCheck.length>0 && examsToCheck.every(ex=>DB.attempts.some(a=>a.guardMobile===g.mobile && a.examId===ex.id));
    (attemptedAll?attend:notAttend).push(g);
  });
  return { attend, notAttend };
}
/* For a "Not Attend" guard: which exam types (within the current month/year/
   exam-type scope) they have not attempted yet — e.g. "Post Psara, Human rights". */
/* Readable label for an exam everywhere the admin sees it. Some exams have an
   empty English name (only exam type / Hindi name set), which used to make
   chips and table cells render blank — so fall back type -> name -> Hindi. */
function examLabel(ex){
  if(!ex) return '-';
  const name = (ex.nameEn||'').trim() || (ex.nameHi||'').trim();
  if(ex.examType && name && name!==ex.examType) return ex.examType + ' — ' + name;
  return ex.examType || name || 'Exam';
}
function missedExamTypesFor(mobile, examsToCheck){
  const missed = examsToCheck.filter(ex=>!DB.attempts.some(a=>a.guardMobile===mobile && a.examId===ex.id));
  return [...new Set(missed.map(ex=>ex.examType || ex.nameEn || ex.nameHi || 'Exam'))];
}

/* ---- exam name headline (security-person side): controlled by admin's
   "Exam name (English)" / "Exam name (Hindi)" checkboxes. Older exams saved
   before this feature had no flags stored, so undefined defaults to true on
   both so their headline keeps showing exactly as it did before. ---- */
function examShowFlags(ex){
  return {
    en: ex.showNameEn!==undefined ? !!ex.showNameEn : true,
    hi: ex.showNameHi!==undefined ? !!ex.showNameHi : true
  };
}
function examHeadlinePlain(ex){
  const f = examShowFlags(ex);
  if(f.en && f.hi) return ex.nameEn + ' / ' + ex.nameHi;
  if(f.en) return ex.nameEn;
  if(f.hi) return ex.nameHi;
  return ex.nameEn;
}
function examHeadlineHtml(ex){
  const f = examShowFlags(ex);
  if(f.en && f.hi) return `${esc(ex.nameEn)} <span style="color:var(--muted);font-weight:500;">/ ${esc(ex.nameHi)}</span>`;
  if(f.en) return esc(ex.nameEn);
  if(f.hi) return esc(ex.nameHi);
  return esc(ex.nameEn);
}
function examTypeChip(ex){
  return ex.examType ? ` <span class="chip">${esc(ex.examType)}</span>` : '';
}

/* ============ EXAM SECURITY (no-copy / screenshot deterrent) ============
   Note: browsers cannot truly block OS-level screenshots/screen recording —
   this is a best-effort deterrent (disables selection/copy/right-click,
   blocks common save/print/devtools shortcuts, and blurs the screen when the
   tab/window loses focus, which catches most snipping-tool / screen-record
   attempts since they take focus away from the browser). */
(function setupExamSecurity(){
  const isSecure = ()=> document.body.classList.contains('secure-mode');
  document.addEventListener('contextmenu', e=>{ if(isSecure()) e.preventDefault(); });
  document.addEventListener('selectstart', e=>{ if(isSecure()) e.preventDefault(); });
  document.addEventListener('dragstart', e=>{ if(isSecure()) e.preventDefault(); });
  ['copy','cut','paste'].forEach(evt=>{
    document.addEventListener(evt, e=>{ if(isSecure()) e.preventDefault(); });
  });
  document.addEventListener('keydown', e=>{
    if(!isSecure()) return;
    const k = e.key;
    const blockedCombo =
      ((e.ctrlKey||e.metaKey) && ['c','x','u','s','p'].includes((k||'').toLowerCase())) ||
      ((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j','c'].includes((k||'').toLowerCase())) ||
      k==='PrintScreen' || k==='F12';
    if(blockedCombo) e.preventDefault();
  });
  window.addEventListener('blur', ()=>{ if(isSecure()) document.body.classList.add('secure-blurred'); });
  document.addEventListener('visibilitychange', ()=>{
    if(isSecure() && document.hidden) document.body.classList.add('secure-blurred');
  });
  window.addEventListener('focus', ()=>{ document.body.classList.remove('secure-blurred'); });
})();

let LAST_HOME_CLICK = 0;
let WINDOW_RESIZE_BOUND = false;
/* Matches the sidebar's CSS transition duration (.55s) — the actual tab
   switch is deferred until the close animation has visibly finished. */
const SIDEBAR_ANIM_MS = 560;
function bindGlobal(){
  document.querySelectorAll('[data-act="home"]').forEach(el=>{
    /* double-click used to fire the click handler twice in a row (and could
       highlight the brand text) — this makes a rapid double-click a no-op:
       the first click still navigates home, the second within 500ms (and any
       native dblclick text-selection) is swallowed. */
    el.addEventListener('dblclick', e=>{ e.preventDefault(); e.stopPropagation(); });
    el.addEventListener('click', e=>{
      const now = Date.now();
      if(now - LAST_HOME_CLICK < 500){ e.preventDefault(); return; }
      LAST_HOME_CLICK = now;
      HISTORY=[]; go('home');
    });
  });
  document.querySelectorAll('[data-act="logout"]').forEach(el=>el.addEventListener('click',()=>{ clearSession(); enterApp('home'); }));
  document.querySelectorAll('[data-navtoggle]').forEach(el=>{
    const toggle = ()=> setAdminSidebarOpen(!S.adminNavOpen);
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
  document.querySelectorAll('.admin-sidebar [data-navto]').forEach(el=>el.addEventListener('click',()=>{
    const id = el.getAttribute('data-navto');
    if(SITE_SETTINGS.sidebarAlwaysOpen){
      // stays open — no slide-shut animation, no width-shrink delay
      resetQB(); goRoot({adminTab:id, adminNavOpen:true});
      return;
    }
    setAdminSidebarOpen(false); // slides shut + the section expands back to full width
    setTimeout(()=>{ resetQB(); goRoot({adminTab:id, adminNavOpen:false}); }, SIDEBAR_ANIM_MS);
  }));
  syncHeaderHeightVar();
  syncSidebarWidthVar();
  if(!WINDOW_RESIZE_BOUND){
    WINDOW_RESIZE_BOUND = true;
    window.addEventListener('resize', ()=>{ syncHeaderHeightVar(); syncSidebarWidthVar(); });
  }
}
/* Toggles the sidebar/section-shrink directly on the existing DOM nodes
   (rather than via patch->render) so the slide/shrink transition is
   actually visible — a full re-render would recreate the elements
   already in their final state and skip the animation entirely. */
function setAdminSidebarOpen(open){
  S.adminNavOpen = open;
  const sidebar = document.querySelector('.admin-sidebar');
  if(sidebar) sidebar.classList.toggle('open', open);
  document.body.classList.toggle('admin-sidebar-open', open);
}
/* keeps the sidebar/backdrop's top offset (--hdr-h) matched to the
   topbar's real rendered height, which varies across breakpoints. */
function syncHeaderHeightVar(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--hdr-h', tb.offsetHeight+'px');
}
/* keeps the section's shrink amount (--sidebar-w) matched to the
   sidebar's real rendered width, since it's capped at 84vw on narrow
   screens and won't always be the full 272px. */
function syncSidebarWidthVar(){
  const sb = document.querySelector('.admin-sidebar');
  if(sb) document.documentElement.style.setProperty('--sidebar-w', sb.offsetWidth+'px');
}

/* a new box's starting spot: opposite side of the hero text (centre alignment alternates sides) */
function newHeroBox(list, kind){
  kind = kind==='text' ? 'text' : 'media';
  const align = (SITE_SETTINGS.heroAlign==='center' || SITE_SETTINGS.heroAlign==='right') ? SITE_SETTINGS.heroAlign : 'left';
  let side;
  if(align==='left') side = 'right';
  else if(align==='right') side = 'left';
  else{ // centred text: alternate, keeping left/right balanced rather than just counting total boxes
    const rightCount = list.filter(b=>b.x>=50).length, leftCount = list.length - rightCount;
    side = rightCount <= leftCount ? 'right' : 'left';
  }
  // centred text sits in the middle of the page, so boxes for that layout sit narrower and further
  // out toward the edges to clear it; left/right layouts can use the wider default.
  const pos = align==='center'
    ? (side==='right' ? {x:70, w:28} : {x:2, w:28})
    : (side==='right' ? {x:55, w:41} : {x:4, w:41});
  const onSide = list.filter(b => (side==='right' ? b.x>=50 : b.x<50)).length;
  const id = 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const y = Math.min(6+onSide*5, 24);
  if(kind==='text') return { id, kind:'text', x:pos.x, y, w:pos.w, h:16, r:0, text:'', fontFamily:'', fontSize:26, color:'#eaeff9', align:'left' };
  return {
    id, kind:'media', x:pos.x, y, w:pos.w, h:66, r:20, type:'image', url:''
  };
}

/* ============ AUTO TRANSLATION (Hindi -> English) ============
   Admins create exams in Hindi only. For those exams the guard gets an EN / हिं
   toggle; choosing EN translates the question + option text through the internet
   (Google Translate, with MyMemory as a backup). Results are cached on the device
   so each text is translated only once. */
const TR_KEY = 'vses_tr_hi_en_v1';
let TR_CACHE = {};
try{ TR_CACHE = JSON.parse(DEMO_LS.getItem(TR_KEY)||'{}') || {}; }catch(e){ TR_CACHE = {}; }
function trSave(){ try{ DEMO_LS.setItem(TR_KEY, JSON.stringify(TR_CACHE)); }catch(e){} }
function trHasDeva(t){ return /[\u0900-\u097F]/.test(t||''); }
function trClean(t){
  // "Pull (Pull)" -> "Pull" : the Hindi text often repeats the English word in brackets
  return String(t).replace(/\b([A-Za-z][A-Za-z.\-' ]*?)\s*\(\s*\1\s*\)/gi,'$1').replace(/\s+/g,' ').trim();
}
function trText(t){
  if(!t || !trHasDeva(t)) return t || '';
  return TR_CACHE[t] || t;
}
async function trFetchOne(text){
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=hi&tl=en&dt=t&q='+encodeURIComponent(text));
    if(!r.ok) throw new Error('http '+r.status);
    const j = await r.json();
    const out = (j[0]||[]).map(x=>x[0]).join('');
    if(out) return trClean(out);
  }catch(e){}
  const r2 = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=hi|en');
  const j2 = await r2.json();
  const o = j2 && j2.responseData && j2.responseData.translatedText;
  if(!o) throw new Error('translation failed');
  return trClean(o);
}
function trStringsForExam(ex){
  const set = new Set();
  questionsForExam(ex.id).forEach(q=>{
    if(q.textHi) set.add(q.textHi);
    if(q.optType!=='image') (q.options||[]).forEach(o=>{ if(o.hi) set.add(o.hi); });
  });
  return [...set].filter(t=>trHasDeva(t));
}
function trMissing(ex){ return trStringsForExam(ex).filter(t=>!TR_CACHE[t]); }
async function trEnsureForExam(ex){
  const todo = trMissing(ex);
  let i = 0, failed = false;
  const worker = async ()=>{
    while(i < todo.length){
      const t = todo[i++];
      try{ TR_CACHE[t] = await trFetchOne(t); }catch(e){ failed = true; }
    }
  };
  await Promise.all(Array.from({length:Math.min(6,todo.length)}, worker));
  trSave();
  if(failed || trMissing(ex).length) throw new Error('translation incomplete');
}
// text to show for a language; Hindi-only exams are translated when English is chosen
function qShow(ex, lang, hiVal, enVal){
  if(ex && ex.qLang==='hi' && lang==='en') return trText(hiVal);
  return lang==='hi' ? hiVal : enVal;
}
async function switchLangWithTranslate(ex, target, btn, apply){
  if(target==='en' && ex && ex.qLang==='hi' && trMissing(ex).length){
    const all = document.querySelectorAll('[data-switch-lang],[data-rlang]');
    all.forEach(b=>b.disabled=true);
    const orig = btn.textContent; btn.textContent = 'Translating…';
    try{ await trEnsureForExam(ex); }
    catch(err){
      console.error(err);
      all.forEach(b=>b.disabled=false); btn.textContent = orig;
      alert('English translation needs an internet connection. Please check your connection and try again.');
      return;
    }
  }
  apply();
}

        alert(msg.includes('ALREADY_ATTEMPTED') ? 'You have already submitted this exam.' : 'Exam could not be submitted. Please check your internet connection and try again.\n\n'+msg);

                           // back-button press that returns to it doesn't wrongly warn

function screenReview(mode){
  const att = DB.attempts.find(a=>a.id===S.attemptId);

  const ex = examById(att.examId);
  const qs = questionsForExam(ex.id);

  const dt = fmtDateTime(att.submittedAt);
  const lang = S.reviewLang || att.lang || 'en';
  const showToggle = !ex.qLang || ex.qLang==='both' || ex.qLang==='hi';
  const headline = mode==='admin'
    ? `${esc(ex.nameEn)}${(ex.nameHi && ex.nameHi.trim() && ex.nameHi.trim()!==(ex.nameEn||'').trim())?` <span style="color:var(--muted);font-weight:500;">/ ${esc(ex.nameHi)}</span>`:''}`
    : examHeadlineHtml(ex);
  return `

      <h2>${headline}${ex.examType?` <span class="chip">${esc(ex.examType)}</span>`:''}</h2>
      <p>${mode==='admin'?`<b style="color:var(--text)">${esc(g?g.name:att.guardMobile)}</b> · ${esc(g?g.gatePass:'')} · ${esc(g?g.post:'')} · `:''}${dt.date} ${dt.time} · Score ${att.score}/${att.total}</p>
    </div>
    ${showToggle?`<div class="lang-toggle">
      <button class="${lang==='en'?'active':''}" data-rlang="en">EN</button>
      <button class="${lang==='hi'?'active':''}" data-rlang="hi">हिं</button>

    const isImg = q.optType==='image';
    const sel = att.answers[i];
    return `<div class="qcard">
      <div class="qtext"><span class="qnum">${i+1}</span><span lang-hi>${esc(qShow(ex,lang,q.textHi,q.textEn))}</span></div>
      <div class="opt-list ${isImg?'opt-images':''}">
        ${q.options.map((opt,oi)=>{
          let cls='';
          if(mode==='admin'){
            if(oi===q.correct) cls='correct';
            else if(oi===sel && sel!==q.correct) cls='wrong';
          } else {
            /* Security person: only their own selected option should show green/red. If the wrong option is selected, the correct answer should not be shown. */
            if(oi===sel){
              const fl = REVIEW_FLAGS[att.id];
              const ok = fl ? !!fl[i] : (q.correct!==undefined ? sel===q.correct : null);
              if(ok!==null) cls = ok ? 'correct' : 'wrong';

          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}
  </div>
  `;
}

  const att = DB.attempts.find(a=>a.id===S.attemptId);
  if(att && SESSION && SESSION.role==='guard' && !REVIEW_FLAGS[att.id]){
    const attId = att.id;
    sb.rpc('get_attempt_review', {p_mobile: SESSION.mobile, p_attempt_id: attId}).then(({data,error})=>{

const DASH_COL = { amber:'var(--amber)', blue:'var(--blue)', green:'var(--green)', red:'var(--red)', violet:'#8B7CF6' };
function dashPct(a){ return a.total>0 ? (a.score/a.total)*100 : 0; }
function dashFmt(n,dec){ return Number(n).toLocaleString('en-IN',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function dashColorFor(p){ return p>=75 ? DASH_COL.green : (p>=50 ? DASH_COL.amber : DASH_COL.red); }
function dashAgo(ts){

function dashShort(s,n){ s = String(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1)+'…' : s; }

const DASH_KEYS = ['registered','exams','attempts','attend','avg','pass','locked','notattend'];

/* smooth area/line chart */
function dashAreaChart(vals, labels, W=720, H=170){
  const L=34,R=14,T=14,B=30, iw=W-L-R, ih=H-T-B;
  const maxV = Math.max(1,...vals), top = maxV<=4 ? 4 : Math.ceil(maxV/4)*4;
  const n = vals.length;
  const x = i => L + (n===1 ? iw/2 : i*iw/(n-1));
  const y = v => T + ih - (v/top)*ih;
  const pts = vals.map((v,i)=>[x(i),y(v)]);
  const clampY = v => Math.max(T, Math.min(T+ih, v));
  let d = '';
  pts.forEach((p,i)=>{
    if(i===0){ d += `M${p[0].toFixed(1)},${p[1].toFixed(1)}`; return; }
    const p0=pts[i-2]||pts[i-1], p1=pts[i-1], p2=p, p3=pts[i+1]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=clampY(p1[1]+(p2[1]-p0[1])/6);
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=clampY(p2[1]-(p3[1]-p1[1])/6);
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  });
  const area = d + ` L${pts[n-1][0].toFixed(1)},${T+ih} L${pts[0][0].toFixed(1)},${T+ih} Z`;
  let grid = '';
  for(let g=0; g<=4; g++){
    const v = top*g/4, gy = y(v);
    grid += `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" class="d-grid-line"/><text x="${L-8}" y="${gy+3.5}" text-anchor="end" class="d-axis">${Math.round(v)}</text>`;
  }
  const step = n>9 ? 2 : 1;
  const xl = labels.map((lb,i)=> (i%step===0 || i===n-1) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="d-axis">${esc(lb)}</text>` : '').join('');
  const dots = pts.map((p,i)=>`<circle class="d-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" style="--i:${i}"><title>${esc(labels[i])}: ${vals[i]} Attend</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="d-svg" role="img" aria-label="Attend per day">
    <defs><linearGradient id="dgArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".45"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    <path d="${area}" fill="url(#dgArea)" class="d-area"/>
    <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="d-line"/>
    ${dots}
  </svg>`;
}

/* vertical columns, values are 0-100 (%) */
function dashColumns(items, W=440, H=170){
  const L=34,R=14,T=18,B=30, iw=W-L-R, ih=H-T-B;
  const n = items.length, slot = iw/n, bw = Math.min(46, slot*0.58);
  const y = v => T + ih - (v/100)*ih;
  let grid = '';
  [0,25,50,75,100].forEach(v=>{ const gy=y(v); grid += `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" class="d-grid-line"/><text x="${L-8}" y="${gy+3.5}" text-anchor="end" class="d-axis">${v}%</text>`; });
  const bars = items.map((it,i)=>{
    const cx = L + slot*i + slot/2, h = Math.max(0,(it.value/100)*ih), by = T+ih-h;
    const col = it.none ? 'var(--line-2)' : dashColorFor(it.value);
    return `<g>
      <rect class="d-bar" x="${(cx-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(it.none?3:0,h).toFixed(1)}" rx="6" fill="${col}" style="--i:${i}"><title>${esc(it.label)}: ${it.none?'Not Attend':it.value.toFixed(1)+'% avg · '+it.n+' Attend'}</title></rect>
      <text x="${cx.toFixed(1)}" y="${(by-6).toFixed(1)}" text-anchor="middle" class="d-val" style="--i:${i}">${it.none?'–':Math.round(it.value)+'%'}</text>
      <text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" class="d-axis">${esc(it.label)}</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="d-svg" role="img" aria-label="Average score per month">${grid}${bars}</svg>`;
}

/* donut / gauge. segs: [{label,value,color}] */
function dashDonut(segs, big, small){
  const total = segs.reduce((s,x)=>s+x.value,0);
  let acc = 0;
  const arcs = segs.filter(s=>s.value>0).map((s,i,arr)=>{
    const p = s.value/total*100, len = Math.max(0.5, p-(arr.length>1?1.4:0));
    const el = `<circle class="d-seg" cx="21" cy="21" r="15.9155" fill="none" stroke="${s.color}" stroke-width="4.6" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" style="--i:${i}"><title>${esc(s.label)}: ${s.value}</title></circle>`;
    acc += p; return el;
  }).join('');
  return `<div class="d-donut"><svg viewBox="0 0 42 42" role="img" aria-label="${esc(small||'chart')}">
      <g transform="rotate(-90 21 21)"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="4.6"/>${arcs}</g></svg>
    <div class="d-donut-c"><b>${big}</b><span>${esc(small||'')}</span></div></div>`;
}
function dashHBars(rows){
  return `<div class="d-hbars">${rows.map((r,i)=>`<div class="d-hrow d-rise" style="--d:${300+i*80}ms">
    <div class="d-hl" title="${esc(r.label)}">${esc(r.label)}</div>
    <div class="d-htrack"><i class="d-hfill" style="width:${Math.max(2,Math.min(100,r.pct)).toFixed(1)}%;background:${r.color};--i:${i}"></i></div>
    <div class="d-hv">${r.text}</div></div>`).join('')}</div>`;
}

  const partPct = nG ? attemptedGuards.size/nG*100 : 0;
  const sumScore = atts.reduce((s,a)=>s+(a.score||0),0), sumTotal = atts.reduce((s,a)=>s+(a.total||0),0);
  const avgPct = sumTotal ? sumScore/sumTotal*100 : 0;
  const passed = atts.filter(a=>isPassed(a.score,a.total)).length;
  const passPct = atts.length ? passed/atts.length*100 : 0;
  const retakes = atts.filter(a=>a.approvedRetake).length;
  const lockedExams = DB.exams.filter(e=>e.locked).length, lockedMonths = DB.months.filter(m=>m.locked).length;
  const nQ = exams.reduce((s,e)=>s+publishedQuestionsForExam(e.id).length,0);

  const kpis = [
    dashKpi(0,'users',DASH_COL.blue,'Registered Security personnel',nG,0,'',`${attemptedGuards.size} Attend ${monthSel?'this month':'so far'}`,null),
    dashKpi(1,'doc',DASH_COL.amber,'Exam sections',exams.length,0,'',`${nQ} published question${nQ===1?'':'s'}`,null),
    dashKpi(2,'clipboard',DASH_COL.violet,'Total Attend',atts.length,0,'',`${retakes} retake${retakes===1?'':'s'} approved`,null),
    dashKpi(3,'target',DASH_COL.green,'Participation',partPct,1,'%',`${attemptedGuards.size} of ${nG} guards`,partPct),
    dashKpi(4,'trend',DASH_COL.blue,'Average score',avgPct,1,'%',`${sumScore} / ${sumTotal} marks`,avgPct),
    dashKpi(5,'award',DASH_COL.green,'Pass rate',passPct,1,'%',`${passed} passed · pass mark ${PASS_PERCENT}%`,passPct),
    dashKpi(6,'lock',DASH_COL.red,'Locked exams',lockedExams,0,'',`of ${DB.exams.length} exams · ${lockedMonths} month${lockedMonths===1?'':'s'} locked`,DB.exams.length?lockedExams/DB.exams.length*100:0),
    dashKpi(7,'refresh',DASH_COL.amber,'Not Attend',Math.max(0,nG-attemptedGuards.size),0,'',`guards yet to take an exam`,nG?(nG-attemptedGuards.size)/nG*100:0),
  ].join('');

  /* ---- attempts per day, last 14 days ---- */
  const days = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(d); }
  const dayVals = days.map(d=>{ const s=d.getTime(), e=s+86400000; return atts.filter(a=>a.submittedAt>=s && a.submittedAt<e).length; });
  const dayLabels = days.map(d=>d.getDate()+' '+MONTH_NAMES[d.getMonth()].slice(0,3));
  const last14 = dayVals.reduce((a,b)=>a+b,0);
  const bestDay = Math.max(0,...dayVals);

  /* ---- month-wise average (always every month, last 8) ---- */
  const monthItems = months.slice(-8).map(m=>{
    const ids = new Set(examsForMonth(m.id).map(e=>e.id));
    const ma = DB.attempts.filter(a=>ids.has(a.examId));
    const st = ma.reduce((s,a)=>s+(a.score||0),0), tt = ma.reduce((s,a)=>s+(a.total||0),0);
    return { label:(MONTH_NAMES[m.monthNum]||m.label).slice(0,3)+' '+String(m.year||'').slice(2), value: tt?st/tt*100:0, n: ma.length, none: !ma.length };
  });

  /* ---- score distribution ---- */
  const buckets = [
    {label:'Excellent (80%+)', value:atts.filter(a=>dashPct(a)>=80).length, color:DASH_COL.green},
    {label:'Good (60–79%)', value:atts.filter(a=>dashPct(a)>=60&&dashPct(a)<80).length, color:DASH_COL.blue},
    {label:'Average (40–59%)', value:atts.filter(a=>dashPct(a)>=40&&dashPct(a)<60).length, color:DASH_COL.amber},
    {label:'Needs work (<40%)', value:atts.filter(a=>dashPct(a)<40).length, color:DASH_COL.red},
  ];

  /* ---- exam-type performance ---- */
  const byType = {};
  atts.forEach(a=>{ const ex = examById(a.examId); const t = (ex&&ex.examType)||'Other'; (byType[t] = byType[t]||{s:0,t:0,n:0}); byType[t].s+=a.score||0; byType[t].t+=a.total||0; byType[t].n++; });
  const typeRows = Object.keys(byType).map(t=>{ const o=byType[t], p=o.t?o.s/o.t*100:0; return {label:t, pct:p, color:dashColorFor(p), text:`${p.toFixed(0)}% <small>· ${o.n}</small>`}; }).sort((a,b)=>b.pct-a.pct);

  /* ---- guards by post ---- */
  const byPost = {};
  guards.forEach(g=>{ const p=(g.post||'').trim()||'Not set'; byPost[p]=(byPost[p]||0)+1; });
  const postArr = Object.keys(byPost).map(p=>({p,c:byPost[p]})).sort((a,b)=>b.c-a.c).slice(0,6);
  const postMax = Math.max(1,...postArr.map(x=>x.c));
  const postRows = postArr.map((x,i)=>({label:x.p, pct:x.c/postMax*100, color:[DASH_COL.blue,DASH_COL.violet,DASH_COL.amber,DASH_COL.green,DASH_COL.red,DASH_COL.blue][i], text:`${x.c}`}));

  /* ---- hardest questions (lowest accuracy) ---- */
  const qStat = {};
  exams.forEach(ex=>{
    const qs = publishedQuestionsForExam(ex.id);
    atts.filter(a=>a.examId===ex.id && Array.isArray(a.answers)).forEach(a=>{
      qs.forEach((q,i)=>{ const o = qStat[q.id] = qStat[q.id] || {q, ex, tot:0, ok:0}; o.tot++; if(a.answers[i]===q.correct) o.ok++; });
    });
  });
  const hardest = Object.values(qStat).filter(o=>o.tot>0).map(o=>Object.assign(o,{acc:o.ok/o.tot*100})).sort((a,b)=>a.acc-b.acc||b.tot-a.tot).slice(0,5);

  /* ---- top performers (latest attempt per exam, per guard) ---- */
  const latest = {};
  atts.forEach(a=>{ const k=a.guardMobile+'|'+a.examId; if(!latest[k] || a.submittedAt>latest[k].submittedAt) latest[k]=a; });
  const perGuard = {};
  Object.values(latest).forEach(a=>{ const o = perGuard[a.guardMobile] = perGuard[a.guardMobile] || {s:0,t:0,n:0}; o.s+=a.score||0; o.t+=a.total||0; o.n++; });
  const top = Object.keys(perGuard).map(m=>{ const o=perGuard[m], g=findGuard(m); return {m, name:g?g.name:m, post:g?g.post:'', pct:o.t?o.s/o.t*100:0, n:o.n}; }).sort((a,b)=>b.pct-a.pct||b.n-a.n).slice(0,3);

  /* ---- recent activity ---- */
  const recent = atts.slice().sort((a,b)=>b.submittedAt-a.submittedAt).slice(0,3);

  const card = (cls, title, sub, body, delay) => `<div class="card d-card d-rise ${cls}" style="--d:${delay}ms"><div class="d-card-h"><h3>${title}</h3><p>${sub}</p></div><div class="d-body"><div class="d-fill">${body}</div></div></div>`;

  return `
  <div class="dash ${animate?'dash-anim':''}" id="dashRoot">
    <div class="d-head d-rise">
      <div><h2>Dashboard <span class="d-live"><i></i>Live</span></h2>
        <p>Overview of guards, exams and results${monthSel?` — ${esc(monthById(monthSel).label)}`:' — all months'}.</p></div>
      <div class="d-filter"><label for="dashMonthSel">Month</label>
        <select id="dashMonthSel"><option value="">All months</option>${months.slice().reverse().map(m=>`<option value="${m.id}" ${m.id===monthSel?'selected':''}>${esc(m.label)}</option>`).join('')}</select></div>
    </div>
    <div class="d-kpis">${kpis}</div>
    <div class="d-grid">
      ${card('c6','Attend trend',`Per day · last 14 days${atts.length?` · <b>${last14}</b> in 14 days · <b>${bestDay}</b> best day`:''}`,
        atts.length ? dashAreaChart(dayVals,dayLabels) : dashEmpty('No Attend yet'), 350)}
      ${card('c3','Score distribution','How guards performed',
        atts.length ? `${dashDonut(buckets, atts.length, 'Attend')}<div class="d-legend">${buckets.map(b=>`<span><i style="background:${b.color}"></i>${b.label}<b>${b.value}</b></span>`).join('')}</div>` : dashEmpty('No Attend yet'), 420)}
      ${card('c3','Participation','Guards who Attend at least one exam',
        nG ? `${dashDonut([{label:'Attend',value:attemptedGuards.size,color:DASH_COL.green},{label:'Not Attend',value:Math.max(0,nG-attemptedGuards.size),color:DASH_COL.amber}], partPct.toFixed(0)+'%', 'participation')}<div class="d-legend"><span><i style="background:${DASH_COL.green}"></i>Attend<b>${attemptedGuards.size}</b></span><span><i style="background:${DASH_COL.amber}"></i>Not Attend<b>${Math.max(0,nG-attemptedGuards.size)}</b></span></div>` : dashEmpty('No guards registered yet'), 490)}
      ${card('c4','Month-wise average score','Average % · last 8 months',
        monthItems.length ? dashColumns(monthItems) : dashEmpty('No months added yet'), 560)}
      ${card('c4','Exam type performance','Average score by exam type',
        typeRows.length ? dashHBars(typeRows) : dashEmpty('No Attend yet'), 630)}
      ${card('c4','Guards by post','Registered Security personnel per post',
        postRows.length ? dashHBars(postRows) : dashEmpty('No guards registered yet'), 700)}
      ${card('c4','Toughest questions','Lowest accuracy first',
        hardest.length ? dashHBars(hardest.map(h=>({label:dashShort(h.q.textEn||h.q.textHi,48)+(h.ex&&h.ex.examType?`  ·  ${h.ex.examType}`:''), pct:h.acc, color:dashColorFor(h.acc), text:`${h.acc.toFixed(0)}% <small>· ${h.tot}</small>`}))) : dashEmpty('No answered questions yet'), 770)}
      ${card('c4','Top performers','Top 3 · highest overall score %',
        top.length ? `<div class="d-list">${top.map((t,i)=>`<div class="d-li d-rise" style="--d:${850+i*80}ms"><span class="d-rank r${i+1}">${i+1}</span><div class="d-li-b"><b>${esc(t.name)}</b><small>${esc(t.post||'')} · ${t.n} exam${t.n===1?'':'s'}</small></div><span class="d-pill" style="--c:${dashColorFor(t.pct)}">${t.pct.toFixed(0)}%</span></div>`).join('')}</div>` : dashEmpty('No results yet'), 840)}
      ${card('c4','Recent activity','Latest 3 submitted exams',
        recent.length ? `<div class="d-list">${recent.map((a,i)=>{ const g=findGuard(a.guardMobile), ex=examById(a.examId), p=dashPct(a); return `<div class="d-li d-rise" style="--d:${900+i*80}ms"><span class="d-avatar">${esc((g&&g.name?g.name:'?').trim().charAt(0).toUpperCase())}</span><div class="d-li-b"><b>${esc(g?g.name:a.guardMobile)}</b><small>${esc(ex?(ex.examType||examLabel(ex)):'-')} · ${dashAgo(a.submittedAt)}</small></div><span class="d-score">${a.score}/${a.total}</span><span class="d-pill" style="--c:${dashColorFor(p)}">${p.toFixed(0)}%</span></div>`; }).join('')}</div>` : dashEmpty('No activity yet'), 910)}
    </div>
  </div>`;
}
function bindAdminDashboard_(){
  const root = document.getElementById('dashRoot'); if(!root) return;
  const sel = document.getElementById('dashMonthSel');
  if(sel) sel.addEventListener('change',()=>{ DASH_REPLAY = true; patch({dashMonth: sel.value}); });
  root.querySelectorAll('.d-kpi[data-dashbox]').forEach(el=>el.addEventListener('click',()=>{
    const k = el.getAttribute('data-dashbox'), now = Date.now();
    if(LAST_KPI_TAP.k===k && now-LAST_KPI_TAP.t<450){ LAST_KPI_TAP = {k:'', t:0}; goPush({dashView:k, dashSearch:''}); }
    else LAST_KPI_TAP = {k, t:now};
  }));
  if(!root.classList.contains('dash-anim')) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  /* count-up for every headline number */
  const els = Array.from(root.querySelectorAll('[data-count]'));
  const t0 = performance.now(), DUR = 1200;
  const fmt = (v,dec)=> Number(v).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  els.forEach(el=>{ el.textContent = fmt(0, parseInt(el.getAttribute('data-dec'),10)||0); });
  function tick(now){
    const k = Math.min(1,(now-t0)/DUR), e = 1-Math.pow(1-k,3);
    els.forEach(el=>{
      const dec = parseInt(el.getAttribute('data-dec'),10)||0, target = parseFloat(el.getAttribute('data-count'))||0;
      el.textContent = fmt(target*e, dec);
    });
    if(k<1 && document.body.contains(root)) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* Saves a partial settings patch immediately (used by the theme + footer
   toggles, which should apply the moment they're clicked). */
function saveSiteSettingPartial(partial, successMsg, opts){
  opts = opts || {};
  Object.assign(SITE_SETTINGS, partial);
  let lsOk = true;
  try{ DEMO_LS.setItem(SITE_SETTINGS_LS_KEY, JSON.stringify(SITE_SETTINGS)); }catch(err){ lsOk = false; }
  if(opts.rerender===false) applyBranding(); else patch({});
  const onFail = (err)=>{ console.error(err); showConfirmToast(lsOk ? 'Saved on this device' : 'Applied for now, but could not be saved (device storage full)'); };
  const dbPartial = Object.assign({}, partial);
  if(dbPartial.heroBoxes) dbPartial.heroBoxes = JSON.stringify(dbPartial.heroBoxes); // hero_boxes is a text column
  adminDb('settings','upsert', toSnake(Object.assign({id:'site'}, dbPartial))).then(({error})=>{
    if(error) onFail(error); else showConfirmToast(successMsg);
  }).catch(onFail);
}

let _boxFileInput = null, _boxFileTarget = null, _boxFileKind = null;
function pickBoxMedia(id, kind){
  if(!_boxFileInput){
    _boxFileInput = document.createElement('input');
    _boxFileInput.type = 'file'; _boxFileInput.style.display = 'none';
    document.body.appendChild(_boxFileInput);
    _boxFileInput.addEventListener('change', async ()=>{
      const file = _boxFileInput.files && _boxFileInput.files[0];
      const target = _boxFileTarget, kind = _boxFileKind;
      _boxFileInput.value = '';
      if(!file || !target) return;
      showConfirmToast(kind==='video' ? 'Uploading video…' : 'Uploading image…');
      try{
        const url = kind==='video'
          ? await uploadVideoToStorage(file, 'hero-box')
          : await uploadImageToStorage(file, 'hero-box', {maxW:1200, maxH:1200, quality:0.8});
        const list = (Array.isArray(SITE_SETTINGS.heroBoxes) ? SITE_SETTINGS.heroBoxes : []).slice();
        const b = list.find(x=>x.id===target);
        if(b){ b.url = url; b.type = kind; }
        saveSiteSettingPartial({heroBoxes:list}, kind==='video' ? 'Video added to box' : 'Image added to box', {rerender:false});
        refreshHeroPreview();
      }catch(err){ alert(err && err.message ? err.message : 'This file could not be used.'); }
    });
  }
  _boxFileTarget = id; _boxFileKind = kind;
  _boxFileInput.accept = kind==='video' ? 'video/*' : 'image/*';
  _boxFileInput.click();
}
function bindHeroBoxes(){
  const layer = document.querySelector('#heroPreviewInner .hero-boxes');
  const stage = document.querySelector('#heroPreviewInner .hero');
  if(!layer || !stage) return;
  const list = ()=> Array.isArray(SITE_SETTINGS.heroBoxes) ? SITE_SETTINGS.heroBoxes : [];
  const findBox = id => list().find(b=>b.id===id);
  const persist = ()=> saveSiteSettingPartial({heroBoxes:list().slice()}, 'Box updated', {rerender:false});

  layer.querySelectorAll('[data-box-drag]').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      if(e.target.closest('.hbtn') || e.target.tagName==='INPUT') return; // let toolbar buttons/slider work normally
      const id = handle.getAttribute('data-box-drag'), b = findBox(id); if(!b) return;
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      const rect = stage.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY, ox = b.x, oy = b.y;
      handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
      e.preventDefault();
      const move = ev=>{
        const dx = ((ev.clientX-startX)/rect.width)*100, dy = ((ev.clientY-startY)/rect.height)*100;
        b.x = Math.max(0, Math.min(100-b.w, ox+dx));
        b.y = Math.max(0, Math.min(100-b.h, oy+dy));
        el.style.left = b.x+'%'; el.style.top = b.y+'%';
      };
      const up = ()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); persist(); };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });

  layer.querySelectorAll('[data-box-resize]').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      const id = handle.getAttribute('data-box-resize'), b = findBox(id); if(!b) return;
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      const rect = stage.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY, ow = b.w, oh = b.h;
      handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
      const move = ev=>{
        const dw = ((ev.clientX-startX)/rect.width)*100, dh = ((ev.clientY-startY)/rect.height)*100;
        b.w = Math.max(12, Math.min(100-b.x, ow+dw));
        b.h = Math.max(12, Math.min(100-b.y, oh+dh));
        el.style.width = b.w+'%'; el.style.height = b.h+'%';
      };
      const up = ()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); persist(); };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });

  layer.querySelectorAll('[data-box-radius]').forEach(r=>{
    r.addEventListener('pointerdown', e=>e.stopPropagation());
    r.addEventListener('input', ()=>{
      const id = r.getAttribute('data-box-radius'), b = findBox(id); if(!b) return;
      b.r = parseInt(r.value,10);
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      if(el) el.style.borderRadius = b.r+'px';
    });
    r.addEventListener('change', persist);
  });

  layer.querySelectorAll('[data-box-del]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-box-del');
      const kept = list().filter(b=>b.id!==id);
      saveSiteSettingPartial({heroBoxes:kept}, 'Box removed', {rerender:false});
      refreshHeroPreview();
    });
  });

  layer.querySelectorAll('[data-box-img]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=> pickBoxMedia(btn.getAttribute('data-box-img'), 'image'));
  });
  layer.querySelectorAll('[data-box-vid]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=> pickBoxMedia(btn.getAttribute('data-box-vid'), 'video'));
  });

  // ---- text-block controls: type straight on the canvas, adjust size/colour/font in the strip ----
  layer.querySelectorAll('[data-box-text]').forEach(el=>{
    const id = el.getAttribute('data-box-text');
    el.addEventListener('pointerdown', e=>e.stopPropagation());
    el.addEventListener('input', ()=>{
      const b = findBox(id); if(!b) return;
      b.text = el.innerText;
    });
    el.addEventListener('blur', persist);
  });
  layer.querySelectorAll('[data-box-fontsize]').forEach(r=>{
    r.addEventListener('pointerdown', e=>e.stopPropagation());
    r.addEventListener('input', ()=>{
      const id = r.getAttribute('data-box-fontsize'), b = findBox(id); if(!b) return;
      b.fontSize = parseInt(r.value,10);
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.fontSize = b.fontSize+'px';
    });
    r.addEventListener('change', persist);
  });
  layer.querySelectorAll('[data-box-color]').forEach(inp=>{
    inp.addEventListener('pointerdown', e=>e.stopPropagation());
    inp.addEventListener('input', ()=>{
      const id = inp.getAttribute('data-box-color'), b = findBox(id); if(!b) return;
      b.color = inp.value;
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.color = b.color;
    });
    inp.addEventListener('change', persist);
  });
  layer.querySelectorAll('[data-box-font]').forEach(sel=>{
    sel.addEventListener('pointerdown', e=>e.stopPropagation());
    sel.addEventListener('change', ()=>{
      const id = sel.getAttribute('data-box-font'), b = findBox(id); if(!b) return;
      b.fontFamily = sel.value;
      ensureFont(b.fontFamily);
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.fontFamily = b.fontFamily ? fontStack(b.fontFamily) : '';
      persist();
    });
  });
}

function adminMonths(){
  if(S.adminMonthId) return adminMonthDetail(S.adminMonthId);
  const months = monthsSorted();

  const defMonth = S.newMonthSel!=null ? S.newMonthSel : now.getMonth();
  const defYear = S.newYearSel!=null ? S.newYearSel : now.getFullYear();
  const yearOptions = [];
  for(let y=now.getFullYear()-1; y<=now.getFullYear()+2; y++) yearOptions.push(y);
  return `
  <div class="card">

    <form id="addMonthForm" style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="margin-bottom:0;min-width:170px;">
        <label>Month</label>
        <select name="monthNum" id="monthNumSel">${MONTH_NAMES.map((mn,i)=>`<option value="${i}" ${i===defMonth?'selected':''}>${mn}</option>`).join('')}</select>
      </div>

        <label>Year</label>
        <select name="yearNum" id="yearNumSel">${yearOptions.map(y=>`<option value="${y}" ${y===defYear?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" type="submit">+ Add month</button>
    </form>
    ${months.length===0?emptyState('calendar','No month added yet','Add the first month from above.'):
    months.map(m=>{
      const exams = examsForMonth(m.id);
      const added = m.createdAt ? ` · Added ${fmtDateTime(m.createdAt).date}` : '';
      const locked = !!m.locked;
      return `<div class="item-row is-click" data-openmonth="${m.id}"><div class="info"><b>${esc(m.label)}</b><span>${exams.length} exam section${exams.length===1?'':'s'}${added}</span></div>
      <div class="actions">

    }).join('')}
  </div>`;
}
function bindAdminMonths(){
  const f = document.getElementById('addMonthForm');
  const ms = document.getElementById('monthNumSel');
  if(ms) ms.addEventListener('change',()=>{ S.newMonthSel = parseInt(ms.value,10); });
  const ys = document.getElementById('yearNumSel');
  if(ys) ys.addEventListener('change',()=>{ S.newYearSel = parseInt(ys.value,10); });
  if(f) f.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const monthNum = parseInt(fd.get('monthNum'),10);
    const yearNum = parseInt(fd.get('yearNum'),10);
    if(DB.months.some(m=>m.monthNum===monthNum && m.year===yearNum)){ alert('This month has already been added.'); return; }
    const label = MONTH_NAMES[monthNum] + ' ' + yearNum;
    const month = {id:uid('mo'), label, monthNum, year:yearNum, createdAt:Date.now(), locked:false};
    withBusy(f, async ()=>{
      const {ok,error} = await dbWriteAdmin('months','insert', toSnake(month));
      if(!ok) throw error;
      DB.months.push(month);
      S.newMonthSel = null; S.newYearSel = null;
      patch({});
      showConfirmToast('Month added');
    });
  });
  document.querySelectorAll('[data-lockmonth]').forEach(el=>el.addEventListener('click',(ev)=>{
    ev.stopPropagation();
    const id = el.getAttribute('data-lockmonth');
    const m = monthById(id);
    if(!m) return;
    const newVal = !m.locked;
    el.disabled = true;
    dbWriteAdmin('months','update', {locked:newVal}, {id}).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Could not update the lock status.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; return; }
      m.locked = newVal;
      patch({});
      showConfirmToast(newVal ? 'Month locked' : 'Month unlocked');
    });
  }));
  document.querySelectorAll('[data-openmonth]').forEach(el=>el.addEventListener('click',()=>goPush({adminMonthId:el.getAttribute('data-openmonth')})));
  document.querySelectorAll('[data-delmonth]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('Delete this entire month? All its exam sections, questions and attempts will also be deleted.')) return;
    const id = el.getAttribute('data-delmonth');
    el.disabled = true;
    dbWriteAdmin('months','delete', null, {id}).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; return; }
      // cascade delete on the DB side already removed exams/questions/attempts under this month
      const examIds = DB.exams.filter(e=>e.monthId===id).map(e=>e.id);
      DB.exams = DB.exams.filter(e=>e.monthId!==id);
      DB.questions = DB.questions.filter(q=>!examIds.includes(q.examId));
      DB.attempts = DB.attempts.filter(a=>!examIds.includes(a.examId));
      DB.months = DB.months.filter(m=>m.id!==id);
      showConfirmToast('Month deleted', 'danger');
      leaveDeletedView('adminMonthId');
    });
  }));
}
/* after deleting the month/exam we are inside, step back so neither the screen nor the back button points at a deleted item */
function leaveDeletedView(key){
  const gone = S[key];
  let target = null;
  while(HISTORY.length){
    const h = HISTORY.pop();
    if(!h[key] || h[key]!==gone){ target = h; break; }
  }
  if(!target){ target = Object.assign({}, S); target[key] = null; if(key==='adminMonthId') target.adminExamId = null; if(key==='adminExamId'){ target.adminTab='months'; } }
  S = target;
  resetQB();
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

  }));
  document.querySelectorAll('[data-qlang]').forEach(el=>el.addEventListener('click',()=>{
    const val = el.getAttribute('data-qlang');
    if(ex && ex.qLang!==val){
      const prev = ex.qLang;
      ex.qLang = val; resetQB(); patch({});
      dbWriteAdmin('exams','update', {q_lang:val}, {id: ex.id}).then(({ok,error})=>{ if(!ok){ console.error(error); ex.qLang = prev; alert('Could not change the question language.\n\n'+(error&&error.message?error.message:'')); patch({}); } });
    }
  }));
  document.querySelectorAll('[data-delq]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('Delete this question?')) return;

    dbWriteAdmin('questions','delete', null, {id: delId}).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; el.textContent='Delete'; return; }
      if(QB_STATE.editId===delId) resetQB();
      DB.questions = DB.questions.filter(q=>q.id!==delId);
      patch({});
      showConfirmToast('Question deleted', 'danger');
    });
  }));
  document.querySelectorAll('[data-editq]').forEach(el=>el.addEventListener('click',()=>{
    const q = DB.questions.find(qq=>qq.id===el.getAttribute('data-editq'));
    if(!q) return;
    QB_STATE = {
      editId: q.id,
      textEn: q.textEn, textHi: q.textHi,
      optType: q.optType,
      opts: q.options.map(o=> q.optType==='text' ? {en:o.en, hi:o.hi, img:null} : {en:'', hi:'', img:o.img}),
      correct: q.correct
    };
    patch({});
    window.scrollTo({top:0, behavior:'smooth'});
  }));
  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{ resetQB(); patch({}); });
  document.querySelectorAll('[data-opttype]').forEach(el=>el.addEventListener('click',()=>{
    QB_STATE.optType = el.getAttribute('data-opttype');
    document.getElementById('optBuilders').innerHTML = renderOptBuilders(ex&&ex.qLang);
    rebindOptBuilders();
    // re-render just the tabs active state
    document.querySelectorAll('[data-opttype]').forEach(t=>t.classList.toggle('active', t.getAttribute('data-opttype')===QB_STATE.optType));
  }));
  rebindOptBuilders();
  const f = document.getElementById('addQForm');
  function collectAndValidate(){
    const fd = new FormData(f);
    const qLang = (ex && ex.qLang) || 'both';
    /* pull whichever language field(s) this exam's mode actually shows;
       for a single-language exam, mirror the same text into both en/hi
       fields so the rest of the app (guard runner, review, export) keeps working */
    if(qLang==='both'){
      QB_STATE.textEn = fd.get('textEn').trim();
      QB_STATE.textHi = fd.get('textHi').trim();
    } else if(qLang==='hi'){
      QB_STATE.textHi = fd.get('textHi').trim();
      QB_STATE.textEn = QB_STATE.textHi;
    } else {
      QB_STATE.textEn = fd.get('textEn').trim();
      QB_STATE.textHi = QB_STATE.textEn;
    }
    if(QB_STATE.optType==='text'){
      if(qLang==='both'){
        if(QB_STATE.opts.some(o=>!o.en.trim()||!o.hi.trim())){ alert('Hindi and English text is required for all 4 options.'); return false; }
      } else if(qLang==='hi'){
        if(QB_STATE.opts.some(o=>!o.hi.trim())){ alert('Hindi text is required for all 4 options.'); return false; }
        QB_STATE.opts.forEach(o=>{ o.en = o.hi; });
      } else {
        if(QB_STATE.opts.some(o=>!o.en.trim())){ alert('English text is required for all 4 options.'); return false; }
        QB_STATE.opts.forEach(o=>{ o.hi = o.en; });
      }
    } else {
      if(QB_STATE.opts.some(o=>!o.img)){ alert('Upload an image for all 4 options.'); return false; }
    }
    return true;
  }
  /* Questions are always saved as drafts (unpublished) until the admin
     clicks the single "Done — publish all drafts" button above the list,
     which publishes every draft question in this exam at once.
     Editing an existing question keeps its current draft/live status. */
  function saveQuestion(){
    if(!collectAndValidate()) return;
    const isEdit = !!QB_STATE.editId;
    let publishedVal;
    if(isEdit){
      const existing = DB.questions.find(qq=>qq.id===QB_STATE.editId);
      publishedVal = existing ? isQPublished(existing) : false;
    } else {
      publishedVal = false;
    }
    if(isEdit){
      const q = DB.questions.find(qq=>qq.id===QB_STATE.editId);
      const updated = {
        textEn: QB_STATE.textEn, textHi: QB_STATE.textHi,
        optType: QB_STATE.optType,
        options: QB_STATE.opts.map(o=>QB_STATE.optType==='text'?{en:o.en.trim(),hi:o.hi.trim()}:{img:o.img}),
        correct: QB_STATE.correct,
        published: publishedVal
      };
      withBusy(f, async ()=>{
        const {correct: _k, ...updatedRow} = updated;
        const {ok,error} = await dbWriteAdmin('questions','update', toSnake(updatedRow), {id: QB_STATE.editId});
        if(!ok) throw error;
        await adminSetKey(QB_STATE.editId, updated.correct);
        if(q) Object.assign(q, updated);
        resetQB();
        patch({});
        showConfirmToast('Question updated');
      });
    } else {
      const order = questionsForExam(S.adminExamId).length;
      const question = {
        id: uid('q'), examId: S.adminExamId, order,
        textEn: QB_STATE.textEn, textHi: QB_STATE.textHi,
        optType: QB_STATE.optType,
        options: QB_STATE.opts.map(o=>QB_STATE.optType==='text'?{en:o.en.trim(),hi:o.hi.trim()}:{img:o.img}),
        correct: QB_STATE.correct,
        published: publishedVal,
        createdAt: Date.now()
      };
      withBusy(f, async ()=>{
        const {correct: _k, ...questionRow} = question;
        const {ok,error} = await dbWriteAdmin('questions','insert', toSnake(questionRow));
        if(!ok) throw error;
        await adminSetKey(question.id, question.correct);
        DB.questions.push(question);
        resetQB();
        patch({});
        showConfirmToast('Question added as draft');
      });
    }
  }
  if(f) f.addEventListener('submit', e=>{ e.preventDefault(); saveQuestion(); });
  const publishAllBtn = document.getElementById('publishAllBtn');
  if(publishAllBtn) publishAllBtn.addEventListener('click', ()=>{
    const drafts = questionsForExam(S.adminExamId).filter(q=>!isQPublished(q));
    if(drafts.length===0) return;
    publishAllBtn.disabled = true; publishAllBtn.textContent = 'Publishing…';
    dbWriteAdmin('questions','update', {published:true}, {id: drafts.map(q=>q.id)}).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Publish failed.\n\n'+(error&&error.message?error.message:'Please try again.')); publishAllBtn.disabled=false; publishAllBtn.textContent='✓ Done — publish all drafts'; return; }
      drafts.forEach(q=>{ q.published = true; });
      patch({});
      showConfirmToast(`${drafts.length} draft question${drafts.length===1?'':'s'} published`);
    });
  });
}

/* Applies a professional Excel look to a worksheet: bold white-on-blue
   header row, thin borders on every cell, soft alternating row shading,
   a header autofilter, and a frozen header row so it stays visible on scroll. */
function styleWorksheetPro(ws, headerRow){
  if(!ws || !ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  const headerR = headerRow!=null ? headerRow : range.s.r;
  const thin = {style:'thin', color:{rgb:'B7C6D9'}};
  for(let R=headerR; R<=range.e.r; R++){
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr]) ws[addr] = {t:'s', v:''};
      const isHeader = R===headerR;
      const stripe = (R-headerR)%2===0;
      ws[addr].s = {
        font: isHeader ? {bold:true, sz:11, color:{rgb:'FFFFFF'}} : {sz:10.5, color:{rgb:'222222'}},
        fill: {patternType:'solid', fgColor:{rgb: isHeader ? '1F4E78' : (stripe?'FFFFFF':'EAF1FA')}},
        alignment: {vertical:'center', horizontal: isHeader?'center':'left', wrapText:false},
        border: {top:thin,bottom:thin,left:thin,right:thin}
      };
    }
  }
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:headerR,c:range.s.c}, e:{r:headerR,c:range.e.c}}) };
  ws['!freeze'] = { xSplit:0, ySplit: headerR+1, topLeftCell: XLSX.utils.encode_cell({r:headerR+1,c:range.s.c}), activePane:'bottomLeft', state:'frozen' };
  ws['!rows'] = ws['!rows'] || [];
  ws['!rows'][headerR] = { hpt: 22 };
}

/* Report heading placed above the result table in every exported sheet:
   title, exam topic / type / month-year, then registered / attend / not-attend counts with %. */
function buildReportTop(topicTxt, typeTxt, monthLabel, attendCount, ncols, pf){
  pf = pf || {pass:0, fail:0};
  const reg = DB.guards.length, notAtt = Math.max(0, reg-attendCount);
  const title = 'Vedanta Limited Chhattisgarh Thermal Power Plant – Security Examination Result (' + monthLabel + ')';
  const info = 'Exam Topic: ' + topicTxt + '   |   Exam Type: ' + typeTxt + '   |   Month, Year: ' + monthLabel;
  const segs = [
    'Total Registered: ' + reg + ' (' + (reg>0?'100%':'0%') + ')',
    'Attend: ' + attendCount + ' (' + pctStr(attendCount,reg) + ')',
    'Not Attend: ' + notAtt + ' (' + pctStr(notAtt,reg) + ')',
    'Pass: ' + pf.pass + ' (' + pctStr(pf.pass,attendCount) + ')',
    'Fail: ' + pf.fail + ' (' + pctStr(pf.fail,attendCount) + ')'
  ];
  const blank = ()=>new Array(ncols).fill('');
  const r0 = blank(); r0[0] = title;
  const r1 = blank(); r1[0] = info;
  const r2 = blank();
  const b = Math.max(1, Math.floor(ncols/5)), starts = [0,1,2,3,4].map(k=>k*b);
  segs.forEach((t,k)=>{ r2[starts[k]] = t; });
  return { starts, nLines:3, rows:[r0, r1, r2, blank()] };
}
function styleReportTop(ws, top, ncols){
  ws['!merges'] = (ws['!merges']||[]);
  ws['!rows'] = ws['!rows'] || [];
  const put = (r,c,style)=>{ const a = XLSX.utils.encode_cell({r,c}); if(!ws[a]) ws[a] = {t:'s', v:''}; ws[a].s = style; };
  for(let c=0;c<ncols;c++){

  ws['!merges'].push({s:{r:0,c:0},e:{r:0,c:ncols-1}}, {s:{r:1,c:0},e:{r:1,c:ncols-1}});
  const colors = ['1F4E78','2E7D32','C62828','1B5E20','B71C1C'], fills = ['EAF1FA','E8F5E9','FDECEA','E8F5E9','FDECEA'];
  top.starts.forEach((st,k)=>{
